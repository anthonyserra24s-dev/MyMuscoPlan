<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>MuscoPlan</title>
<meta name="description" content="Planification et suivi d'entraînement multi-sport — musculation, calisthenics, course, raquette.">
<meta name="theme-color" content="#12151A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MuscoPlan">
<link id="favicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2312151A'/%3E%3Cpath d='M20 55 L36 55 L36 40 L50 40 L50 65 L64 65 L64 45 L80 45' stroke='%23FFFFFF' stroke-width='9' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link id="appleicon" rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2312151A'/%3E%3Cpath d='M20 55 L36 55 L36 40 L50 40 L50 65 L64 65 L64 45 L80 45' stroke='%23FFFFFF' stroke-width='9' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --ink:#12151A;
  --ink-soft:#1E2229;
  --bg:#F5F6F8;
  --bg-elev:#FFFFFF;
  --surface:#FFFFFF;
  --surface-2:#F0F1F4;
  --surface-3:#E8EAEE;
  --border:#E6E8EC;
  --border-soft:#EDEEF1;
  --border-strong:#D6D9DF;
  --text:#12151A;
  --text-dim:#6B7280;
  --text-faint:#9CA3AF;
  --accent:#18181B;
  --accent-2:#52525B;
  --accent-dim:#EFEFF1;
  --danger:#3F3F46;
  --danger-dim:#E4E4E7;
  --warn:#71717A;
  --warn-dim:#F4F4F5;
  --sport-muscu:#18181B;
  --sport-cali:#52525B;
  --sport-course:#71717A;
  --sport-raquette:#A1A1AA;
  --sport-team:#3F3F46;
  --radius-lg:18px;
  --radius-md:12px;
  --radius-sm:10px;
  --shadow:0 1px 2px rgba(16,18,22,.05);
  --shadow-md:0 8px 24px rgba(16,18,22,.08);
  --font-display:var(--font-body);
  --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  --font-mono:var(--font-body);
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:var(--font-display);font-weight:700;letter-spacing:-.01em;margin:0;}
.mono{font-variant-numeric:tabular-nums;}
button,input,select,textarea{font-family:inherit;color:inherit;}
button{cursor:pointer;}
a{color:var(--accent-2);}
::selection{background:#E4E4E7;}
input,select,textarea{
  background:var(--surface);
  border:1px solid var(--border-strong);
  color:var(--text);
  border-radius:var(--radius-sm);
  padding:10px 12px;
  font-size:15px;
  width:100%;
  outline:none;
  transition:border-color .15s;
}
input[type=checkbox],input[type=radio]{width:18px;height:18px;flex:0 0 auto;padding:0;accent-color:var(--accent);}
input:focus,select:focus,textarea:focus{border-color:var(--accent-2);outline:2px solid #E4E4E7;outline-offset:0;}
input::placeholder,textarea::placeholder{color:var(--text-faint);}
label{font-size:11.5px;color:var(--text-dim);display:block;margin:0 0 6px 2px;font-weight:600;text-transform:uppercase;letter-spacing:.3px;}
.field{margin-bottom:14px;}
.chip-select-list{display:flex;flex-direction:column;gap:7px;}
.chip-select{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--border-strong);background:var(--surface);cursor:pointer;transition:border-color .15s,background .15s;}
.chip-select input[type=checkbox]{width:18px;height:18px;flex:0 0 18px;margin:0;accent-color:var(--accent);}
.chip-select .sw{width:9px;height:9px;border-radius:50%;flex:0 0 9px;}
.chip-select .lbl{font-size:14px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.chip-select:has(input:checked){border-color:var(--accent);background:var(--accent-dim);}
.tag-wrap{display:flex;flex-wrap:wrap;gap:7px;}
.tag-toggle{display:inline-flex;align-items:center;padding:8px 13px;border-radius:99px;font-size:12.5px;font-weight:600;background:var(--surface);border:1px solid var(--border-strong);color:var(--text-dim);transition:border-color .15s,background .15s,color .15s;}
.tag-toggle.active{border-color:var(--accent);background:var(--accent-dim);color:var(--accent);}
.gs-swatch{width:30px;height:30px;border-radius:50%;border:2px solid var(--border-strong);cursor:pointer;padding:0;flex-shrink:0;}
.gs-swatch.active{border-color:var(--text);box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--text);}
.gs-swatch-custom{position:relative;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;}
.row{display:flex;gap:10px;}
.row>.field{flex:1;}

#layout{display:flex;min-height:100vh;}
#app{max-width:560px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:calc(72px + var(--safe-bottom));width:100%;}
.sidenav{display:none;}
.grid-auto{display:flex;flex-direction:column;}
.dash-grid{display:block;}

/* Topbar (dark, mobile chrome — matches BudgetPlan's mobile topbar) */
.topbar{
  position:sticky;top:0;z-index:20;
  background:var(--ink);color:#F6F7F9;
  padding:calc(14px + var(--safe-top)) 18px 12px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid rgba(255,255,255,.08);
}
.topbar .brand{display:flex;align-items:center;gap:9px;}
.brand-mark{width:26px;height:26px;border-radius:7px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.brand-mark svg{width:15px;height:15px;}
.topbar h1{font-size:17px;font-weight:700;color:#F6F7F9;}
.topbar .sub{font-size:12px;color:#9CA1AC;margin-top:1px;}
.icon-btn{
  width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);
  display:flex;align-items:center;justify-content:center;color:#C6CAD2;
}
.icon-btn svg{width:18px;height:18px;}
.icon-btn:active{transform:scale(.94);}
.icon-btn.accent{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);}

main#views{padding:16px 16px 24px;}
.view{display:none;}
.view.active{display:block;animation:fadein .22s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

.tabs-sub{display:flex;gap:6px;background:var(--surface);border:1px solid var(--border);padding:4px;border-radius:12px;margin-bottom:16px;overflow-x:auto;}
.tabs-sub button{flex:1;white-space:nowrap;background:transparent;border:none;color:var(--text-dim);font-size:12.5px;font-weight:600;padding:9px 8px;border-radius:9px;}
.tabs-sub button.active{background:var(--surface-3);color:var(--text);box-shadow:var(--shadow);}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;margin-bottom:14px;box-shadow:var(--shadow);}
.card-tight{padding:12px 14px;}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.card-header h2{font-size:15px;font-weight:700;}
.card-header .link{font-size:12.5px;color:var(--accent-2);font-weight:600;background:none;border:none;padding:0;}

.section-title{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);font-weight:700;margin:22px 2px 10px;}
.section-title:first-child{margin-top:0;}

.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  border:none;border-radius:var(--radius-sm);padding:13px 18px;font-size:15px;font-weight:600;
  width:100%;transition:opacity .15s;
}
.btn-primary{background:var(--ink);color:#fff;}
.btn-primary:active{opacity:.8;}
.btn-secondary{background:var(--surface);color:var(--text);border:1px solid var(--border-strong);}
.btn-ghost{background:transparent;color:var(--text-dim);border:1px dashed var(--border-strong);}
.btn-danger{background:var(--danger-dim);color:var(--danger);}
.btn-sm{padding:8px 12px;font-size:13px;width:auto;border-radius:8px;}
.btn:disabled{opacity:.4;}
.btn svg{width:16px;height:16px;}

.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--surface-2);border:1px solid var(--border);color:var(--text-dim);}
.chip-toggle{cursor:pointer;}
.chip-toggle.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 1px var(--border-strong) inset;}

/* Bottom nav (dark, matches BudgetPlan) */
.bottomnav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;
  background:var(--ink);
  border-top:1px solid rgba(255,255,255,.08);
  display:flex;padding:8px 6px calc(8px + var(--safe-bottom));z-index:30;
}
.navbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;color:#8B909B;padding:6px 2px;border-radius:10px;position:relative;}
.navbtn svg{width:21px;height:21px;}
.navbtn span{font-size:10px;font-weight:600;}
.navbtn.active{color:#F6F7F9;}
.navbtn .fab-dot{position:absolute;top:2px;right:22%;width:6px;height:6px;border-radius:50%;background:var(--accent);}

/* KPI grid */
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:13px 14px;box-shadow:var(--shadow);}
.kpi .lbl{font-size:10.5px;color:var(--text-dim);font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
.kpi .val{font-size:21px;font-weight:700;margin-top:5px;letter-spacing:-.01em;}
.kpi .delta{font-size:11.5px;margin-top:3px;font-weight:600;}
.delta.up{color:var(--accent);}
.delta.down{color:var(--danger);}
.delta.flat{color:var(--text-faint);}

/* Calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.cal-head h2{font-size:16px;font-weight:700;text-transform:capitalize;}
.cal-nav{display:flex;gap:6px;}
.cal-toggle{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;border:1px solid var(--border);}
.cal-toggle button{background:none;border:none;color:var(--text-dim);font-size:12px;font-weight:600;padding:6px 12px;border-radius:8px;}
.cal-toggle button.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
.cal-dow{text-align:center;font-size:10px;color:var(--text-faint);font-weight:700;padding-bottom:4px;text-transform:uppercase;}
.cal-day{
  aspect-ratio:1;border-radius:10px;background:var(--surface-2);border:1px solid var(--border-soft);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:5px 2px 6px;
  position:relative;font-size:12px;color:var(--text-dim);
}
.cal-day.other-month{opacity:.4;}
.cal-day.today{border-color:var(--accent);color:var(--accent);font-weight:700;background:var(--accent-dim);}
.cal-day.dragover{border-color:var(--accent-2);background:var(--surface-3);}
.cal-day .pills{display:flex;flex-wrap:wrap;gap:2px;margin-top:3px;justify-content:center;}
.cal-pill-dot{width:6px;height:6px;border-radius:50%;box-shadow:0 0 0 1px var(--border-strong) inset;}
.cal-week-list{display:flex;flex-direction:column;gap:8px;}
.week-row{display:flex;gap:10px;align-items:stretch;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:10px 12px;box-shadow:var(--shadow);}
.week-row.today{border-color:var(--accent);}
.week-day-lbl{width:46px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--text-dim);font-weight:700;text-transform:uppercase;}
.week-day-lbl b{font-size:17px;color:var(--text);}
.week-sessions{flex:1;display:flex;flex-direction:column;gap:6px;}
.week-sessions .empty-slot{font-size:12px;color:var(--text-faint);padding:8px 0;}

.sess-pill{
  display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:var(--surface-2);
  border:1px solid var(--border);font-size:12.5px;cursor:pointer;
}
.sess-pill .txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;}
.sess-pill .status-icon{width:15px;height:15px;flex-shrink:0;}
.sess-pill[draggable=true]{touch-action:none;}

/* Modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(10,11,14,.45);backdrop-filter:blur(2px);z-index:100;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;}
.modal-backdrop.open{opacity:1;pointer-events:auto;}
.modal-sheet{
  background:var(--surface);border:1px solid var(--border);border-bottom:none;
  border-radius:22px 22px 0 0;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;
  padding:10px 18px calc(22px + var(--safe-bottom));transform:translateY(100%);transition:transform .28s cubic-bezier(.32,.72,0,1);
  box-shadow:0 -10px 40px rgba(16,18,22,.14);
}
.modal-backdrop.open .modal-sheet{transform:translateY(0);}
.modal-handle{width:36px;height:4px;background:var(--border-strong);border-radius:99px;margin:8px auto 14px;}
.modal-title{font-size:17px;font-weight:700;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;}
.modal-title .icon-btn{width:32px;height:32px;background:var(--surface-2);border-color:var(--border);color:var(--text-dim);}

/* Toast */
#toast-root{position:fixed;top:calc(12px + var(--safe-top));left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;width:100%;pointer-events:none;}
.toast{background:var(--ink);border:1px solid rgba(255,255,255,.1);color:#F6F7F9;padding:11px 18px;border-radius:99px;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(16,18,22,.25);animation:toastin .2s ease;}
@keyframes toastin{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:none;}}

/* Empty state */
.empty-state{text-align:center;padding:34px 16px;color:var(--text-dim);}
.empty-state svg{width:38px;height:38px;color:var(--text-faint);margin-bottom:10px;}
.empty-state .t{font-weight:700;color:var(--text);margin-bottom:4px;font-size:14.5px;}
.empty-state .d{font-size:12.5px;line-height:1.5;}

/* Lists */
.list-item{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--border);}
.list-item:last-child{border-bottom:none;}
.list-item .swatch{width:9px;height:9px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 1px var(--border-strong) inset;}
.list-item .main{flex:1;min-width:0;}
.list-item .title{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.list-item .meta{font-size:11.5px;color:var(--text-dim);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.list-item .trail{font-size:12px;color:var(--text-dim);text-align:right;flex-shrink:0;line-height:1.55;white-space:nowrap;}
.swipe-actions{display:flex;gap:6px;}

/* Exercises tab: responsive card grid (fills available width, no orphan blank column) */
.ex-sport-title{display:flex;align-items:center;gap:9px;margin-bottom:14px;width:100%;background:none;border:none;padding:6px 2px;text-align:left;cursor:pointer;}
.ex-sport-title .dot{width:9px;height:9px;flex-shrink:0;}
.ex-sport-title h2{font-size:15.5px;font-weight:700;}
.ex-sport-title .ex-sport-count{font-size:11.5px;color:var(--text-dim);font-weight:600;}
.ex-sport-title .chevron{margin-left:auto;color:var(--text-faint);flex-shrink:0;}
.ex-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-bottom:6px;}
.ex-cat-header{grid-column:1/-1;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);font-weight:700;margin:8px 2px -2px;}
.ex-cat-header:first-child{margin-top:0;}
.ex-item-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:13px 14px;box-shadow:var(--shadow);min-width:0;}
.ex-item-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px 14px;flex-wrap:wrap;}
.ex-item-info{flex:1 1 130px;min-width:0;}
.ex-item-title{font-weight:600;font-size:14px;line-height:1.3;overflow-wrap:break-word;}
.ex-item-meta{font-size:11.5px;color:var(--text-dim);margin-top:2px;overflow-wrap:break-word;}
.ex-item-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;max-width:100%;}
.ex-item-actions .chip{white-space:nowrap;}
.variants-wrap{margin-top:8px;padding-top:2px;}
.ex-variant-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--border-soft);flex-wrap:wrap;}
.ex-variant-row .swatch{width:9px;height:9px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 1px var(--border-strong) inset;}
.ex-variant-row .main{flex:1 1 120px;min-width:0;}
.ex-variant-row .title{font-size:13px;font-weight:600;overflow-wrap:break-word;}
.ex-variant-row .meta{font-size:11px;color:var(--text-dim);margin-top:1px;overflow-wrap:break-word;}
.ex-variant-row .actions{display:flex;align-items:center;gap:6px;flex-shrink:0;}

/* Set table (workout tracker) */
.set-table{width:100%;border-collapse:collapse;}
.set-table th{font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;font-weight:700;padding:0 4px 8px;text-align:center;}
.set-table th:first-child{text-align:left;}
.set-row td{padding:4px;}
.set-row td:first-child{color:var(--text-dim);font-size:13px;font-weight:600;text-align:left;padding-left:2px;}
.set-row input{padding:9px 4px;text-align:center;font-size:14px;font-weight:600;}
.prev-hint{font-size:9px;color:var(--text-faint);text-align:center;margin-top:3px;white-space:nowrap;}
.set-row .check{width:34px;height:34px;border-radius:9px;border:1px solid var(--border-strong);background:var(--surface);display:flex;align-items:center;justify-content:center;margin:0 auto;}
.set-row.done .check{background:var(--accent);border-color:var(--accent);color:#fff;}
.set-row.done input{border-color:var(--accent);}
.set-row .check svg{width:15px;height:15px;}

.ex-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 12px;margin-bottom:12px;box-shadow:var(--shadow);}
.ex-card-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;padding:0 4px;gap:8px;}
.ex-card-head h3{font-size:14.5px;font-weight:700;}
.ex-card-head .best{font-size:11.5px;color:var(--accent);font-weight:600;}

/* Rest timer overlay */
#rest-timer{position:fixed;left:0;right:0;bottom:calc(74px + var(--safe-bottom));display:flex;justify-content:center;z-index:60;pointer-events:none;}
#rest-timer .box{pointer-events:auto;background:var(--ink);border:1px solid rgba(255,255,255,.15);border-radius:99px;padding:10px 10px 10px 20px;display:flex;align-items:center;gap:14px;box-shadow:0 10px 30px rgba(16,18,22,.3);}
#rest-timer .t{font-size:19px;font-weight:700;color:#F6F7F9;min-width:52px;}
#rest-timer button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#F6F7F9;width:36px;height:36px;border-radius:50%;font-size:13px;font-weight:700;}

/* Charts */
.chart-wrap{width:100%;overflow-x:auto;}
.chart-wrap svg{display:block;}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;}
.legend .li{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text-dim);}
.legend .sw{width:8px;height:8px;border-radius:2px;}

.progress-bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;}
.progress-bar > div{height:100%;border-radius:99px;background:var(--accent);transition:width .3s;}

.badge-status{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:99px;}
.badge-status.planned{background:var(--surface-2);color:var(--text-dim);}
.badge-status.done{background:var(--accent-dim);color:var(--accent);}
.badge-status.missed{background:var(--danger-dim);color:var(--danger);}

.fab-add{position:fixed;right:16px;bottom:calc(88px + var(--safe-bottom));width:54px;height:54px;border-radius:50%;background:var(--ink);color:#fff;border:none;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px rgba(16,18,22,.35);z-index:40;}
.fab-add svg{width:24px;height:24px;}
.fab-add:active{transform:scale(.93);}

.grabber{color:var(--text-faint);width:16px;height:16px;flex-shrink:0;}
.hidden{display:none !important;}

/* ===== Desktop / large screens: sidebar layout, no bottom nav ===== */
@media (min-width:901px){
  html,body{height:100%;}
  #layout{width:100%;}
  .sidenav{
    display:flex;flex-direction:column;gap:3px;width:236px;flex-shrink:0;

  }

  .sidenav .side-brand .brand-mark{width:28px;height:28px;}
  .sidenav .side-brand b{font-size:16.5px;font-weight:700;color:#F6F7F9;}
  .sidenav .navbtn{flex-direction:row;justify-content:flex-start;gap:13px;padding:11px 13px;border-radius:9px;color:#9CA1AC;}
  .sidenav .navbtn:hover{background:rgba(255,255,255,.05);color:#F6F7F9;}
  .sidenav .navbtn.active{background:#F6F7F9;color:var(--ink);}

  .sidenav .navbtn svg{width:19px;height:19px;}
  .bottomnav{display:none !important;}

  main#views{max-width:1320px;margin:0 auto;padding:26px 40px 60px;}
  .topbar{background:transparent;color:var(--text);padding:18px 40px;max-width:1320px;margin:0 auto;border-bottom:1px solid var(--border);}

  .tabs-sub{max-width:520px;}
}

/* ===== Mobile landscape (phones, width<901px): switch to sidebar nav like desktop,
   hide the bottom nav, and respect the left safe area (notch / Dynamic Island) ===== */

  html,body{height:100%;}

/* ===== Any short-height landscape viewport (phones held sideways): trim the header

}

   Placed last so it always wins over the width-based padding rules above, on any

   (viewport-fit=cover + border-box) so there's no white band behind the notch —

<script>
/* ============================================================
   MuscoPlan — logique application (vanilla JS, localStorage)
   ============================================================ */
const $ = (sel,ctx=document)=>ctx.querySelector(sel);
const $$ = (sel,ctx=document)=>Array.from(ctx.querySelectorAll(sel));
const uid = ()=> Date.now().toString(36)+Math.random().toString(36).slice(2,8);
/* ---------- Dates ----------
   IMPORTANT : on ne convertit JAMAIS un Date construit en heure locale via
   .toISOString() pour en extraire "YYYY-MM-DD" — .toISOString() bascule en
   UTC et décale la date d'un jour pour tout fuseau en avance sur UTC
   (Europe, etc.). toLocalISO() ci-dessous lit les composants locaux
   (année/mois/jour) du Date, ce qui garde le calendrier du bloc et le
   Dashboard parfaitement synchronisés quel que soit le fuseau horaire. */
function toLocalISO(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
const todayISO = ()=> toLocalISO(new Date());
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));

const DOW = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
const MONTHS = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
function fmtDate(iso,opts={}){
  const d=new Date(iso+'T00:00:00');
  if(opts.short) return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'});
  if(opts.long) return d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
  return d.toLocaleDateString('fr-FR');
}
function addDays(iso,n){const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return toLocalISO(d);}
function startOfWeek(iso){const d=new Date(iso+'T00:00:00');const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return toLocalISO(d);}
function isoWeeksBetween(a,b){return Math.round((new Date(b)-new Date(a))/(7*864e5));}
function weekKey(iso){return startOfWeek(iso);}

/* ---------- Toast ---------- */
function toast(msg){
  const root=$('#toast-root');
  const el=document.createElement('div');
  el.className='toast';el.textContent=msg;
  root.appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .25s';setTimeout(()=>el.remove(),250);},2200);
}

/* ---------- Modal sheet ---------- */
let MODAL_STACK=[];
function openModal(title,bodyHtml,{onMount}={}){
  if(MODAL_STACK.length){ MODAL_STACK[MODAL_STACK.length-1].style.display='none'; }
  const backdrop=document.createElement('div');
  backdrop.className='modal-backdrop';
  backdrop.innerHTML=`<div class="modal-sheet" role="dialog">
    <div class="modal-handle"></div>
    <div class="modal-title"><span>${title}</span><button class="icon-btn" id="modal-close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <div class="modal-body">${bodyHtml}</div>
  </div>`;
  document.body.appendChild(backdrop);
  MODAL_STACK.push(backdrop);
  backdrop.addEventListener('click',e=>{if(e.target===backdrop)closeModal();});
  $('#modal-close',backdrop).addEventListener('click',()=>closeModal());
  requestAnimationFrame(()=>backdrop.classList.add('open'));
  if(onMount) onMount(backdrop);
}
function closeModal(){
  const m=MODAL_STACK.pop();
  if(!m) return;
  m.classList.remove('open');
  setTimeout(()=>m.remove(),200);
  if(MODAL_STACK.length){ MODAL_STACK[MODAL_STACK.length-1].style.display=''; }
}

/* ---------- Data model & defaults ---------- */
const SPORT_TYPES = {
  strength:{label:'Force / Musculation'},
  cardio:{label:'Cardio / Endurance'},
  racket:{label:'Sport de raquette'},
  team:{label:'Sport collectif'},
  mixed:{label:'Mixte (Crossfit / WOD)'}
};
const BODY_ZONES = ['Épaule','Coude','Poignet','Dos bas','Dos haut','Genou','Cheville','Hanche','Cou','Général'];
/* Classification ultra-simple d'un exercice : une seule catégorie choisie directement à la
   création (au lieu d'un patron de mouvement à déduire) + un muscle principal. */
const DEFAULT_MUSCLE_LIST = ['Pectoraux','Dos','Épaules','Biceps','Triceps','Quadriceps','Ischios','Fessiers','Lombaires','Abdos','Mollets'];
/* Un exercice peut cibler plusieurs muscles principaux (ex: Tractions = Dos + Biceps).
   Le champ est stocké sous forme de tableau ; muscleArr() normalise les anciennes données
   où primaryMuscle était encore une simple chaîne, pour ne rien casser. */
function muscleArr(ex){
  const pm=ex&&ex.primaryMuscle;
  if(Array.isArray(pm)) return pm.filter(Boolean);
  if(pm) return [pm];
  return [];
}
/* Classification Polyarticulaire / Isolation : auto (>1 muscle principal => polyarticulaire)
   sauf si ex.polyarticular a été fixé explicitement (case à cocher dans la fiche exercice),
   ce qui permet de corriger les cas comme "Curl marteau" (biceps + avant-bras mais isolation). */
function isPolyarticular(ex){
  if(!ex) return false;
  if(ex.polyarticular===true) return true;
  if(ex.polyarticular===false) return false;
  return muscleArr(ex).length>1;
}
/* Parse une fourchette de reps textuelle ("8-10", "12", "AMRAP 5+") en {min,max}. */
function parseRepRange(str){
  const s=String(str||'');
  const range=s.match(/(\d+)\s*-\s*(\d+)/);
  if(range) return {min:+range[1],max:+range[2]};
  const single=s.match(/\d+/);
  if(single) return {min:+single[0],max:+single[0]};
  return null;
}
function multiMusclePickerHTML(id, selectedArr){
  const sel=selectedArr||[];
  return `<input type="hidden" id="${id}" value="${sel.join(',')}">
  <div class="tag-wrap" id="${id}-chips">${(DB.muscles||DEFAULT_MUSCLE_LIST).map(mu=>`<button type="button" class="chip chip-toggle ${sel.includes(mu)?'active':''}" data-muscle="${mu}">${mu}</button>`).join('')}</div>`;
}
function bindMultiMusclePicker(id, m){
  const hidden=$('#'+id,m);
  $$('#'+id+'-chips .chip-toggle',m).forEach(btn=>btn.addEventListener('click',()=>{
    btn.classList.toggle('active');
    hidden.value=$$('#'+id+'-chips .chip-toggle.active',m).map(b=>b.dataset.muscle).join(',');
  }));
}
/* ============================================================
   TRI & AFFICHAGE UNIFIÉS DES EXERCICES
   Toutes les listes d'exercices de l'appli (routine, séance, bibliothèque,
   stats) passent par ces helpers pour un ordre et un libellé cohérents. */
/* La liste des catégories (Push/Pull/Legs/...) vit désormais dans GLOBAL.categories
   (partagée entre profils, comme le catalogue d'exercices) : modifiable depuis
   Réglages (ajout / renommage avec cascade sur les exercices / suppression).
   DEFAULT_CATEGORIES sert uniquement de valeur initiale pour un nouvel appareil. */
const DEFAULT_CATEGORIES = ['Push','Pull','Legs','Abdos / Core','Épaules & Santé / Préhab','Endurance / Sports'];
const CAT_ABS_MUSCLES = ['Abdominaux','Obliques','Lombaires'];
const CAT_PUSH_MUSCLES = ['Pectoraux','Épaules','Triceps'];
const CAT_PULL_MUSCLES = ['Dos / Grand dorsal','Biceps','Avant-bras'];
const CAT_LEG_MUSCLES = ['Quadriceps','Ischios-jambiers','Fessiers','Mollets'];
function exerciseCategoryOptionsHTML(selected){
  return (DB.categories||DEFAULT_CATEGORIES).map(c=>`<option value="${c}" ${c===selected?'selected':''}>${c}</option>`).join('');
}
/* Catégorie Push/Pull/Legs/Abdos-Core/Endurance d'un exercice : lue directement sur ex.category
   (choisie à la création — plus simple et plus fiable qu'un patron de mouvement à déduire).
   Pour les exercices créés avant cette simplification (ancien champ "pattern"), on retombe
   sur l'ancienne logique de déduction pour ne rien casser. */
function exerciseCategory(ex){
  if(ex.variantOf){
    const parent=getExercise(ex.variantOf);
    if(parent) return exerciseCategory(parent);
  }
  if((DB.categories||DEFAULT_CATEGORIES).includes(ex.category)) return ex.category;
  if(ex.pattern==='Poussée') return 'Push';
  if(ex.pattern==='Tirage') return 'Pull';
  if(ex.pattern==='Charnière de hanche' || ex.pattern==='Flexion de genou') return 'Legs';
  if(ex.pattern==='Cardio / Athlétisme / Raquette') return 'Endurance / Sports';
  if(ex.pattern==='Gainage / Isolation'){
    const pm=muscleArr(ex)[0];
    if(CAT_ABS_MUSCLES.includes(pm)) return 'Abdos / Core';
    if(CAT_PUSH_MUSCLES.includes(pm)) return 'Push';
    if(CAT_PULL_MUSCLES.includes(pm)) return 'Pull';
    if(CAT_LEG_MUSCLES.includes(pm)) return 'Legs';
    return 'Abdos / Core';
  }
  /* exercice créé avant toute classification : repli sur le type de sport */
  const sport=getSport(ex.sportId);
  if(sport && !['strength','mixed'].includes(sport.type)) return 'Endurance / Sports';
  return 'Push';
}
/* Libellé uniformisé : "Exercice - Variante" pour une variante, "Exercice (Normal)" pour la référence,
   pour qu'on sache toujours de quel exercice parent une variante dépend. */
function exerciseDisplayName(ex){
  if(!ex) return '?';
  if(ex.variantOf){
    const parent=getExercise(ex.variantOf);
    return `${parent?parent.name:'?'} - ${ex.name}`;
  }
  return `${ex.name} (Normal)`;
}
/* Trie une liste d'exercices : Push -> Pull -> Legs -> Abdos/Core -> Endurance, puis alphabétique. */
function sortExercisesByCategory(list){
  return [...list].sort((a,b)=>{
    const ca=(DB.categories||DEFAULT_CATEGORIES).indexOf(exerciseCategory(a));

  });

/* ============================================================
   STOCKAGE — architecture multi-profil à étanchéité stricte
   ------------------------------------------------------------
   Deux couches de stockage bien séparées :
   1) GLOBAL (clé unique, partagée) : catalogue d'exercices/sports,
      liste des muscles, et la LISTE des profils (id + nom uniquement).
      Rien de personnel n'y vit — un profil ne peut donc jamais lire
      les données d'un autre via cette clé.
   2) PROFIL (une clé localStorage dédiée par profil) : routines,
      séances, blocs, objectifs, historique de perfs/PR, blessures,
      journal nutrition/poids, préférences. Totalement isolée : le
      profil actif charge UNIQUEMENT sa propre clé.
   `DB` reste, en mémoire, la fusion GLOBAL + PROFIL actif — tout le
   reste du code (DB.routines, DB.sessions, etc.) continue de
   fonctionner sans changement, mais DB ne contient jamais, à aucun
   moment, les données de deux profils à la fois.
   ============================================================ */
const GLOBAL_KEY = 'muscoplan_global_v1';
const LEGACY_DB_KEY = 'muscoplan_db_v1';
function profileStorageKey(profileId){ return 'muscoplan_profile_'+profileId+'_v1'; }

function defaultGlobal(){
  return {
    version:2,
    sports:[
      {id:'sp_muscu',name:'Musculation',type:'strength',color:'#18181B',bodyweightBased:false},
      {id:'sp_cali',name:'Calisthenics',type:'strength',color:'#52525B',bodyweightBased:true},
      {id:'sp_course',name:'Course / Athlétisme',type:'cardio',color:'#71717A',bodyweightBased:false},
      {id:'sp_padel',name:'Padel / Tennis',type:'racket',color:'#A1A1AA',bodyweightBased:false},
    ],
    exercises:[
      {id:'ex1',sportId:'sp_muscu',name:'Développé couché',category:'Push',primaryMuscle:'Pectoraux',variantOf:null},
      {id:'ex2',sportId:'sp_muscu',name:'Squat',category:'Legs',primaryMuscle:'Quadriceps',variantOf:null},
      {id:'ex3',sportId:'sp_muscu',name:'Soulevé de terre',category:'Legs',primaryMuscle:'Fessiers',variantOf:null},
      {id:'ex4',sportId:'sp_muscu',name:'Tractions lestées',category:'Pull',primaryMuscle:'Dos',variantOf:null},
      {id:'ex5',sportId:'sp_muscu',name:'Développé militaire',category:'Push',primaryMuscle:'Épaules',variantOf:null},
      {id:'ex6',sportId:'sp_cali',name:'Dips',category:'Push',primaryMuscle:'Triceps',variantOf:null},

      {id:'ex8',sportId:'sp_cali',name:'Pistol squat',category:'Legs',primaryMuscle:'Quadriceps',variantOf:null},
    ],
    muscles:[...DEFAULT_MUSCLE_LIST],
    categories:[...DEFAULT_CATEGORIES],
    profiles:[]
  };
}
function defaultProfileData(){
  return {
    blocks:[], routines:[], sessions:[], bodylog:[], nutrilog:[], injuries:[], goals:[],
    settings:{ units:'kg', goalProtein:150,goalCarbs:250,goalFat:70,goalWater:2.5, restDefault:90, onboarded:true }
  };
}
let GLOBAL = null;
let CURRENT_PROFILE_ID = null;
function loadGlobal(){
  try{
    const raw=localStorage.getItem(GLOBAL_KEY);
    if(!raw) return defaultGlobal();
    return Object.assign(defaultGlobal(), JSON.parse(raw));
  }catch(e){console.error(e);return defaultGlobal();}
}
function saveGlobal(){ localStorage.setItem(GLOBAL_KEY, JSON.stringify(GLOBAL)); }
function loadProfileData(profileId){
  try{
    const raw=localStorage.getItem(profileStorageKey(profileId));
    if(!raw) return defaultProfileData();
    const parsed=JSON.parse(raw);
    const merged=Object.assign(defaultProfileData(),parsed);
    merged.settings=Object.assign(defaultProfileData().settings, parsed.settings||{});
    return merged;
  }catch(e){console.error(e);return defaultProfileData();}
}
/* Migration ponctuelle depuis l'ancienne version mono-fichier (une seule clé
   partagée entre tous les profils). Séances/blocs sont répartis vers leur
   profil d'origine (via l'ancien tag profileId) ; le reste (routines,
   objectifs, blessures, journal...) part vers le premier profil, faute de
   pouvoir déterminer un propriétaire dans l'ancien format. Ne s'exécute
   qu'une fois : l'ancienne clé est supprimée une fois la migration faite. */
function migrateLegacyIfNeeded(){
  if(localStorage.getItem(GLOBAL_KEY)) return; // déjà migré / déjà sur la nouvelle archi
  const raw=localStorage.getItem(LEGACY_DB_KEY);
  if(!raw) return;
  try{
    const old=JSON.parse(raw);
    const profiles=(old.profiles&&old.profiles.length)?old.profiles:[{id:'pr_default',name:'Moi'}];
    const g=defaultGlobal();
    g.sports=old.sports||g.sports;
    g.exercises=old.exercises||g.exercises;
    g.muscles=old.muscles||g.muscles;
    g.categories=old.categories||g.categories;
    g.profiles=profiles.map(p=>({id:p.id,name:p.name}));
    localStorage.setItem(GLOBAL_KEY, JSON.stringify(g));
    const defaultProfileId=profiles[0].id;
    profiles.forEach(p=>{
      const pd=defaultProfileData();
      pd.blocks=(old.blocks||[]).filter(b=>(b.profileId||defaultProfileId)===p.id);
      pd.sessions=(old.sessions||[]).filter(s=>(s.profileId||defaultProfileId)===p.id);
      if(p.id===defaultProfileId){
        pd.routines=old.routines||[];
        pd.bodylog=old.bodylog||[];
        pd.nutrilog=old.nutrilog||[];
        pd.injuries=old.injuries||[];
        pd.goals=old.goals||[];
        if(old.settings) pd.settings=Object.assign(pd.settings, {
          units:old.settings.units, goalProtein:old.settings.goalProtein, goalCarbs:old.settings.goalCarbs,
          goalFat:old.settings.goalFat, goalWater:old.settings.goalWater, restDefault:old.settings.restDefault, onboarded:true
        });
      }
      localStorage.setItem(profileStorageKey(p.id), JSON.stringify(pd));
    });
    localStorage.removeItem(LEGACY_DB_KEY);
  }catch(e){ console.error('Migration MuscoPlan échouée', e); }
}
let DB = null;
/* Fusionne GLOBAL + les données du profil actif dans DB (objet unique
   utilisé par tout le reste de l'application, inchangé). */
function enterProfile(profileId){
  const p=(GLOBAL.profiles||[]).find(x=>x.id===profileId);
  if(!p) return;
  CURRENT_PROFILE_ID=profileId;
  const pd=loadProfileData(profileId);
  DB={ sports:GLOBAL.sports, exercises:GLOBAL.exercises, muscles:GLOBAL.muscles, categories:GLOBAL.categories, profiles:GLOBAL.profiles,
       blocks:pd.blocks, routines:pd.routines, sessions:pd.sessions, bodylog:pd.bodylog, nutrilog:pd.nutrilog,
       injuries:pd.injuries, goals:pd.goals, settings:pd.settings };
  DB.settings.activeProfileId=profileId;
  hideLockscreen();
  navigate('dashboard');
}
/* Persiste DB dans les deux couches (global partagé + silo du profil actif).
   Ne fait rien si aucun profil n'est actif (ex: sur l'écran de sélection). */
function saveDB(){
  if(!CURRENT_PROFILE_ID || !DB) return;
  GLOBAL.sports=DB.sports; GLOBAL.exercises=DB.exercises; GLOBAL.muscles=DB.muscles; GLOBAL.categories=DB.categories; GLOBAL.profiles=DB.profiles;
  saveGlobal();
  const pd={ blocks:DB.blocks, routines:DB.routines, sessions:DB.sessions, bodylog:DB.bodylog, nutrilog:DB.nutrilog,
             injuries:DB.injuries, goals:DB.goals, settings:DB.settings };
  localStorage.setItem(profileStorageKey(CURRENT_PROFILE_ID), JSON.stringify(pd));
}
function logout(){
  saveDB();
  CURRENT_PROFILE_ID=null; DB=null;
  showLockscreen();
}

/* Résout l'id de suivi (racine) d'un exercice : une variante hérite de l'historique de son exercice de référence */
function trackingExId(exId){

function activeInjuryZones(){

/* ---------- Profils (multi-utilisateurs sur un même appareil) ---------- */
function getProfile(id){ return (DB.profiles||[]).find(p=>p.id===id); }
function profileName(id){ const p=getProfile(id); return p?p.name:'—'; }
/* Résout le profil "propriétaire" d'une séance : priorité au profil explicite de la
   séance, sinon celui du bloc auquel elle appartient, sinon le profil actif global.
   Garantit qu'une séance ancienne (créée avant cette fonctionnalité) retombe toujours
   sur un profil valide plutôt que de planter ou de tout mélanger. */
function sessionProfileId(s){
  if(!s) return null;
  if(s.profileId) return s.profileId;
  if(s.blockId){ const b=getBlock(s.blockId); if(b && b.profileId) return b.profileId; }
  return DB.settings.activeProfileId || ((DB.profiles||[])[0] && DB.profiles[0].id) || null;
}

   profil à la fois (le sien). Ces fonctions sont conservées comme no-ops

function sessionVolume(s){
  if(!s.entries) return 0;
  let v=0;
  s.entries.forEach(ex=>{ (ex.sets||[]).forEach(st=>{ if(st.done){ v += (Number(st.weight)||0) * (Number(st.reps)||0); } }); });
  return v;
}
function est1RM(weight,reps){
  weight=Number(weight)||0;reps=Number(reps)||0;
  if(weight<=0||reps<=0) return 0;
  if(reps===1) return weight;
  return weight*(1+reps/30);
}

  if(!list.length) return `<div class="empty-state" style="padding:14px 4px;"><div class="d">Pas encore de record enregistré. Valide une séance pour voir apparaître tes PRs ici.</div></div>`;
  return list.map(p=>`<div class="list-item">
    <div class="swatch" style="background:${getSport(getExercise(p.exId)?.sportId)?.color||'#888'}"></div>

    <div class="trail">${p.weight}kg × ${p.reps}<br><span style="color:var(--accent)">1RM ~${Math.round(p.e1rm)}kg</span></div>
  </div>`).join('');
}

function computeAllPRs(){
  const prs={};
  DB.sessions.filter(s=>s.status==='done').forEach(s=>{
    (s.entries||[]).forEach(ex=>{
      const rootId=trackingExId(ex.exId);
      (ex.sets||[]).forEach(st=>{
        if(!st.done) return;
        const e1=est1RM(st.weight,st.reps);
        if(e1<=0) return;
        const cur=prs[rootId];
        if(!cur || e1>cur.e1rm){
          prs[rootId]={exId:rootId,e1rm:e1,weight:st.weight,reps:st.reps,date:s.date};
        }
      });
    });
  });
  return prs;
}
/* Historique des performances passées pour un exercice — STRICTEMENT le même exercice/variante
   (exId exact, pas la racine). "Dernière fois" ne doit jamais mélanger Développé couché - Halte
   avec Développé couché - Barre : ce sont deux exécutions différentes. Pour les records globalisés
   par exercice racine, voir computeAllPRs() / trackingExId(). */
/* Historique STRICTEMENT filtré par profil : l'historique d'Anthony sur un exercice ne doit
   jamais alimenter les suggestions ou la ligne "Dernière fois" du bloc de Lisa, même si les deux
   utilisent le même exercice. profileId est résolu par l'appelant via sessionProfileId(). */
function exerciseHistory(exId,beforeDate,profileId){
  const out=[];
  [...DB.sessions].filter(s=>s.status==='done' && (!beforeDate || s.date<beforeDate) && (profileId==null || sessionProfileId(s)===profileId)).sort((a,b)=>b.date.localeCompare(a.date)).forEach(s=>{
    (s.entries||[]).forEach(ex=>{
      if(ex.exId===exId){ out.push({date:s.date,targetReps:ex.targetReps||'',sets:ex.sets.filter(st=>st.done && (st.weight||st.reps))}); }
    });
  });
  return out;
}
/* ============================================================
   MOTEUR DE SUGGESTION INTELLIGENTE (Charge x RPE x Volume)
   Calcule la suggestion pour le couple [Profil + Exercice/Variante], sur la base de la
   DERNIÈRE séance validée pour CE profil, en ajouts/retraits fixes en kg (jamais de %).

   Règle de sécurité (prioritaire) : une hausse de charge n'est proposée QUE SI le nombre
   minimal de reps de l'objectif a été atteint sur TOUTES les séries de la séance précédente.
   Sinon on maintient (ou on baisse si l'échec est sévère), quel qu'ait été le RPE.

   Sinon, grille d'ajustement selon le RPE moyen de la dernière séance validée :
     RPE ≤ 5            → forte hausse (+5kg poly / +1 à +2.5kg iso)
     5 < RPE ≤ 7.5       → hausse modérée SI le haut de la fourchette est atteint partout
                            (+2.5kg poly / +1kg iso), sinon on vise d'abord le haut des reps
     8 ≤ RPE < 9.5        → zone cible idéale, on maintient et on vise le haut des reps
     RPE ≥ 9.5             → effort maximal, on maintient (le volume est déjà validé ici)
     Pas de RPE renseigné → on ne peut pas affiner, message dédié
*/
function progressionSuggestion(exId, profileId, currentTargetReps){
  const hist=exerciseHistory(exId,null,profileId);
  if(!hist.length || !hist[0].sets.length) return null;
  const last=hist[0];
  const weights=last.sets.map(s=>Number(s.weight)||0).filter(w=>w>0);
  if(!weights.length) return null;
  const topWeight=Math.max(...weights);
  const exDef=getExercise(exId);
  const poly=isPolyarticular(exDef);
  const repRange=parseRepRange(currentTargetReps||last.targetReps);
  const rpes=last.sets.map(s=>Number(s.rpe)).filter(r=>r>0);
  const avgRpe=rpes.length?rpes.reduce((a,b)=>a+b,0)/rpes.length:null;
  const round5=n=>Math.round(n*2)/2;
  const bigInc = poly ? 5 : (topWeight<=20?1:2.5);
  const smallInc = poly ? 2.5 : 1;
  const reduceInc = poly ? 5 : 2.5;

  let volumeValidated=true, severeFail=false, highReached=false;
  if(repRange){
    const repsAchieved=last.sets.map(st=>Number(st.reps)||0);
    volumeValidated = repsAchieved.every(r=>r>=repRange.min);
    highReached = repsAchieved.every(r=>r>=repRange.max);
    if(!volumeValidated){
      const worst=Math.min(...repsAchieved);
      severeFail = worst<=0 || worst<=(repRange.min-3);
    }
  }

  let suggested=topWeight, note='';
  if(repRange && !volumeValidated){
    if(severeFail){
      suggested=round5(topWeight-reduceInc);
      note=`Volume non tenu (objectif ${repRange.min}+ reps) — baisse de -${reduceInc}kg`;
    } else {
      suggested=topWeight;
      note=`Objectif de ${repRange.min}+ reps non atteint sur toutes les séries — maintien de la charge`;
    }
  } else if(avgRpe===null){
    note='Ajoute un RPE pour affiner la suggestion';
  } else if(avgRpe<=5){
    suggested=round5(topWeight+bigInc);
    note=`Effort très facile (RPE ${avgRpe.toFixed(1)}) — augmentation recommandée de +${bigInc}kg`;
  } else if(avgRpe<=7.5){
    if(repRange && highReached){
      suggested=round5(topWeight+smallInc);
      note=`Haut de la fourchette atteint (RPE ${avgRpe.toFixed(1)}) — augmentation de +${smallInc}kg`;
    } else {
      note='Marge dispo, vise le haut de la fourchette de reps avant d\'augmenter la charge';
    }
  } else if(avgRpe<9.5){
    note=`Zone cible idéale (RPE ${avgRpe.toFixed(1)}) — maintiens la charge, vise le haut de la fourchette de reps`;
  } else {
    note=`Effort maximal (RPE ${avgRpe.toFixed(1)}) — maintien de la charge`;
  }
  return {suggested,note,lastDate:last.date,lastWeight:topWeight};
}
/* Volume total (poids x reps) d'une séance pour un exercice, et volume effectivement validé (sets done) */
function entryVolume(entry,onlyDone){
  return (entry.sets||[]).filter(st=>!onlyDone||st.done).reduce((sum,st)=>sum+(Number(st.weight)||0)*(Number(st.reps)||0),0);
}
/* Compare le volume validé de la dernière séance à celui de l'avant-dernière, pour un exercice/variante donné */
function volumeProgress(exId,profileId){
  const hist=exerciseHistory(exId,null,profileId);
  if(hist.length<2) return null;
  const volNow=hist[0].sets.reduce((sum,st)=>sum+(Number(st.weight)||0)*(Number(st.reps)||0),0);
  const volPrev=hist[1].sets.reduce((sum,st)=>sum+(Number(st.weight)||0)*(Number(st.reps)||0),0);
  if(volPrev<=0) return null;
  const pct=((volNow-volPrev)/volPrev)*100;
  return {volNow,volPrev,pct};
}
/* Tendance de charge moyenne max sur les 4 dernières semaines : % d'évolution, ou détection de plateau */
function monthTrend(exId,profileId){
  const hist=exerciseHistory(exId,null,profileId);
  if(!hist.length) return null;
  const cutoff=new Date(); cutoff.setDate(cutoff.getDate()-28);
  const cutoffISO=cutoff.toISOString().slice(0,10);
  const recent=hist.filter(h=>h.date>=cutoffISO);
  const tops=recent.map(h=>{
    const ws=h.sets.map(s=>Number(s.weight)||0).filter(w=>w>0);
    return ws.length?Math.max(...ws):0;
  }).filter(w=>w>0);
  if(tops.length<2) return null;
  const newest=tops[0], oldest=tops[tops.length-1];
  if(oldest<=0) return null;
  const pct=((newest-oldest)/oldest)*100;
  if(Math.abs(pct)<1.5 && tops.length>=3) return {type:'plateau',pct,label:'Plateau détecté ce mois-ci : envisage un deload de 10%'};
  const sign=pct>=0?'+':'';
  return {type:'trend',pct,label:`${sign}${pct.toFixed(1)}% de charge moy. ce mois-ci`};
}

  DB.sessions.filter(s=>s.status==='done').forEach(s=>{

        if(st.done && (Number(st.reps)||0)>=(Number(goal.targetReps)||1) && (Number(st.weight)||0)>best) best=Number(st.weight);
      });
    });
  });
  return best;
}

/* ============================================================
   SURCHARGE PROGRESSIVE AUTOMATIQUE (par bloc)
   Principe : dans un bloc, chaque routine (ex: "PULL 1") revient chaque
   semaine. La toute première occurrence VALIDÉE ("Faite") de cette routine
   dans le bloc sert de référence (= semaine 1). Pour chaque occurrence
   ultérieure de la même routine dans le même bloc, on calcule le nombre
   de semaines écoulées depuis cette référence et on ajoute (mode "fixed")
   ou compose (mode "percent") l'incrément réglé sur le bloc — appliqué au
   poids RÉELLEMENT enregistré en semaine 1, pas à une estimation.
   Recalculé à chaque ouverture de séance : dès que la semaine de référence
   est validée, les semaines suivantes se mettent à jour automatiquement. */
function blockChainWeight(block, routineId, sessionDate, exId, setIndex){
  const ap=block.autoProgression;
  if(!ap || !ap.enabled) return null;
  const priorDone=DB.sessions
    .filter(x=>x.blockId===block.id && x.routineId===routineId && x.status==='done' && x.date<sessionDate)
    .sort((a,b)=>a.date.localeCompare(b.date));
  if(!priorDone.length) return null;
  const reference=priorDone[0]; // 1ère occurrence validée de cette routine dans le bloc = semaine de référence
  const refEntry=(reference.entries||[]).find(e=>e.exId===exId); if(!refEntry) return null;
  const refSet=(refEntry.sets||[])[setIndex]; const refWeight=Number(refSet&&refSet.weight)||0;
  if(refWeight<=0) return null;
  const weekIdx=isoWeeksBetween(startOfWeek(reference.date),startOfWeek(sessionDate));
  if(weekIdx<=0) return null;
  const target = ap.mode==='percent'
    ? Math.round(refWeight*Math.pow(1+(ap.value||0)/100,weekIdx)*2)/2
    : Math.round((refWeight+(ap.value||0)*weekIdx)*2)/2;
  return {target, refWeight, refDate:reference.date, weekIdx};
}
/* Pré-remplit automatiquement (si le champ est encore vide) le poids des séances
   planifiées d'un bloc avec la charge calculée par blockChainWeight(). Appelé à
   chaque ouverture de la vue Séance : la valeur se met donc à jour dès qu'une
   nouvelle référence est validée, sans action manuelle. */
function applyBlockProgression(s){
  if(!s || s.status!=='planned' || !s.blockId || !s.routineId) return;
  const block=getBlock(s.blockId);
  if(!block || !block.autoProgression || !block.autoProgression.enabled) return;
  let changed=false;
  (s.entries||[]).forEach(ex=>{
    (ex.sets||[]).forEach((st,si)=>{
      if(st.done || (st.weight && !st.autoFilled)) return; // on ne touche jamais une série validée ou un poids saisi à la main
      const r=blockChainWeight(block, s.routineId, s.date, ex.exId, si);
      if(r){ st.weight=String(r.target); st.autoFilled=true; changed=true; }
    });
  });
  if(changed) saveDB();
}

/* Aperçu complet du contenu d'une routine (exercices, variantes, séries × reps cibles)
   affiché avant validation dans les modales de planification. */
function routineDetailHTML(routineId){
  if(!routineId) return '';
  const r=getRoutine(routineId); if(!r) return '';
  const sport=getSport(r.sportId);
  if(!sport || !['strength','mixed'].includes(sport.type)){
    return `<div class="chip" style="margin:2px 0 14px;">${sport?sport.name:''} · séance cardio / libre — pas d'exercices détaillés</div>`;
  }
  const items=r.items||[];
  if(!items.length){
    return `<div style="font-size:12px;color:var(--text-faint);margin:2px 0 14px;">Cette routine ne contient encore aucun exercice.</div>`;
  }
  return `<div class="card card-tight" style="margin:2px 0 14px;background:var(--surface-2);">
    <div style="font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-bottom:8px;">Aperçu · ${items.length} exercice(s)</div>
    ${items.map((it,i)=>{
      const ex=getExercise(it.exerciseId);
      return `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;${i<items.length-1?'border-bottom:1px solid var(--border-soft);':''}">
        <span style="font-size:13px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${ex?ex.name:'? (exercice supprimé)'}${ex&&ex.variantOf?`<span style="color:var(--text-faint);font-weight:500;"> · variante</span>`:''}</span>
        <span class="mono" style="font-size:12px;color:var(--accent);white-space:nowrap;flex-shrink:0;">${it.targetSets||3}×${it.targetReps||'8-10'}</span>
      </div>`;
    }).join('')}
  </div>`;
}
function buildEntriesFromRoutine(routineId, beforeDate, profileId){
  const r=getRoutine(routineId); if(!r) return [];
  const sport=getSport(r.sportId)||{type:'mixed'};
  if(sport.type==='strength' || sport.type==='mixed'){
    return (r.items||[]).map(it=>{
      const nSets=it.targetSets||3;
      const hist=exerciseHistory(it.exerciseId, beforeDate, profileId)[0];
      const targetRepsNum=(String(it.targetReps||'').match(/\d+/)||[])[0]||'';
      return {
        exId:it.exerciseId,
        targetSets:nSets,
        targetReps:it.targetReps||'',
        sets:Array.from({length:nSets}).map((_,si)=>{
          const prevSet=hist && hist.sets[si];
          return {
            /* 1ère séance du bloc (pas d'historique) : poids vide (placeholder 0), reps cibles pré-remplies.
               Séances suivantes : poids ET reps pré-remplis avec la dernière performance réelle validée,
               pour ajuster immédiatement la surcharge progressive. autoFilled=true signale que ce n'est
               pas une saisie manuelle : applyBlockProgression() pourra encore l'écraser avec la charge
               calculée par la chaîne de progression du bloc si celle-ci est activée. */
            weight: (prevSet && prevSet.weight) ? prevSet.weight : '',
            reps: (prevSet && prevSet.reps) ? prevSet.reps : targetRepsNum,
            rpe:'', bw:'', done:false, autoFilled:!!(prevSet && prevSet.weight)
          };
        })
      };
    });
  }
  return [];
}

/* Génère le contenu à onglets (Push/Pull/Legs/Abdos/Endurance) + recherche instantanée pour choisir
   un ou plusieurs exercices. checkboxClass = classe des checkboxes ; idPrefix évite les collisions
   d'id quand ce composant est utilisé plusieurs fois (picker de séance vs modale "ajouter"). */
function exercisePickerTabsHTML(roots, idPrefix, checkboxClass, opts={}){
  const single = !!opts.single;

  if(!cats.length) return `<div style="font-size:12.5px;color:var(--text-dim);padding:8px 2px;">Aucun exercice pour ce sport.</div>`;

  ${cats.map((c,i)=>`<div class="picker-panel" data-picker-panel="${c}" style="display:${i===0?'block':'none'};margin-top:10px;">
    ${byCat[c].map(e=>{
      const variants=hideVariants?[]:DB.exercises.filter(v=>v.variantOf===e.id);
      const pr=prs[e.id];
      return `<div class="picker-row" data-picker-row style="padding:8px 2px;border-bottom:1px solid var(--border-soft);">
      <label style="display:flex;align-items:center;gap:10px;">

        <span style="font-size:14px;flex:1;" data-picker-label>${e.name}${pr?`<span style="color:var(--accent);font-size:11px;font-family:var(--font-mono);"> · PR ${pr.weight}kg×${pr.reps}</span>`:''}</span>
      </label>
      ${variants.length?`<select class="${checkboxClass}-variant" data-for="${e.id}" style="margin:8px 0 0 28px;width:calc(100% - 28px);font-size:12.5px;padding:8px 10px;display:none;">
        <option value="${e.id}">${e.name} (Normal)</option>
        ${variants.map(v=>`<option value="${v.id}">${e.name} - ${v.name}</option>`).join('')}
      </select>`:''}

  </div>`).join('')}
  </div>`;

/* Câble les onglets + la recherche instantanée d'un exercisePickerTabsHTML rendu dans le conteneur `root` */
function bindExercisePickerTabs(root, idPrefix, checkboxClass){
  $$(`[data-picker-tab]`,root).forEach(btn=>btn.addEventListener('click',()=>{
    $$(`[data-picker-tab]`,root).forEach(b=>b.classList.toggle('active',b===btn));
    $$(`[data-picker-panel]`,root).forEach(p=>p.style.display = p.dataset.pickerPanel===btn.dataset.pickerTab ? 'block':'none');
  }));
  $$(`.${checkboxClass}`,root).forEach(cb=>cb.addEventListener('change',()=>{
    const variantSel=$(`.${checkboxClass}-variant[data-for="${cb.value}"]`,root);
    if(variantSel) variantSel.style.display = cb.checked? 'block':'none';
  }));
  const search=$(`#${idPrefix}-search`,root);
  if(search) search.addEventListener('input',()=>{
    const q=search.value.trim().toLowerCase();
    if(!q){
      // recherche vide : on revient à l'onglet actif normal
      $$(`[data-picker-panel]`,root).forEach(p=>p.style.display = p.dataset.pickerPanel===$(`[data-picker-tab].active`,root)?.dataset.pickerTab ? 'block':'none');
      $$(`[data-picker-row]`,root).forEach(r=>r.style.display='');
      return;
    }
    // en recherche : on montre tous les onglets, on masque les lignes qui ne matchent pas
    $$(`[data-picker-panel]`,root).forEach(p=>p.style.display='block');
    $$(`[data-picker-row]`,root).forEach(r=>{
      const label=r.querySelector('[data-picker-label]');
      const match=label && label.textContent.toLowerCase().includes(q);
      r.style.display=match?'':'none';
    });
  });
}

function strengthExCardHTML(s,ex,idx){

  const sameExBefore = s.entries.slice(0,idx).filter(en=>en.exId===ex.exId).length;
  const occurrence = sameExBefore>0 ? sameExBefore+1 : (s.entries.filter(en=>en.exId===ex.exId).length>1 ? 1 : 0);
  const block = s.blockId? getBlock(s.blockId) : null;
  const chainOn = block && block.autoProgression && block.autoProgression.enabled && s.routineId;
  const rows = ex.sets.map((st,si)=>{
    const prevSet = hist && hist.sets[si];
    const chain = chainOn ? blockChainWeight(block, s.routineId, s.date, ex.exId, si) : null;
    const weightPlaceholder = chain? chain.target : (prevSet&&prevSet.weight?prevSet.weight:'0');
    const repsPlaceholder = ex.targetReps ? ex.targetReps : (prevSet&&prevSet.reps?prevSet.reps:'0');
    const weightHint = chain
      ? `<div class="prev-hint" style="color:var(--accent);">S+${chain.weekIdx} · ${chain.refWeight}→${chain.target}kg</div>`
      : (prevSet&&prevSet.weight?`<div class="prev-hint">Prev ${prevSet.weight}kg</div>`:'');
    return `
    <tr class="set-row ${st.done?'done':''}" data-ex="${idx}" data-set="${si}">
      <td>${si+1}</td>
      <td><input type="number" inputmode="decimal" class="set-input" data-field="weight" value="${st.weight}" placeholder="${weightPlaceholder}" style="${st.autoFilled?'color:var(--accent);':''}">${weightHint}</td>
      <td><input type="number" inputmode="numeric" class="set-input" data-field="reps" value="${st.reps}" placeholder="${repsPlaceholder}">${prevSet&&prevSet.reps?`<div class="prev-hint">Prev ${prevSet.reps}</div>`:''}</td>
      <td><input type="number" inputmode="numeric" class="set-input" data-field="rpe" value="${st.rpe}" placeholder="–" min="1" max="10"></td>

/* Remplacement rapide : change l'exercice d'une entrée en cours de séance (ex: machine prise)
   sans toucher à l'historique déjà enregistré — seule cette entrée de LA séance en cours pointe
   désormais vers le nouvel exercice ; les séances passées restent inchangées. */
function openReplaceExerciseModal(s,idx){
  const current=getExercise(s.entries[idx].exId);
  const candidates=sortExercisesByCategory(DB.exercises.filter(e=>e.sportId===s.sportId && e.id!==current.id));
  openModal('Remplacer — '+(current?current.name:''),`
    <input id="replace-search" placeholder="Rechercher un exercice..." style="margin-bottom:10px;">
    <div id="replace-list" style="display:flex;flex-direction:column;gap:4px;max-height:50vh;overflow:auto;"></div>
  `,{onMount:(m)=>{
    const listEl=$('#replace-list',m);
    function draw(q){
      const qq=(q||'').toLowerCase();
      const filtered=candidates.filter(e=>exerciseDisplayName(e).toLowerCase().includes(qq));
      listEl.innerHTML=filtered.map(e=>`<button class="btn btn-secondary" data-pick-replacement="${e.id}" style="justify-content:flex-start;">${exerciseDisplayName(e)}</button>`).join('') || `<div style="font-size:12.5px;color:var(--text-dim);">Aucun résultat</div>`;
      $$('[data-pick-replacement]',listEl).forEach(btn=>btn.addEventListener('click',()=>{
        s.entries[idx].exId=btn.dataset.pickReplacement;
        saveDB(); closeModal(); toast('Exercice remplacé'); render();
      }));
    }
    draw('');
    $('#replace-search',m).addEventListener('input',e=>draw(e.target.value));
    $('#replace-search',m).focus();
  }});
}
/* Calculateur de plaques : décompose le poids total en plaques par côté sur une barre olympique de 20kg */
const PLATE_SIZES=[25,20,15,10,5,2.5,1.25];
function openPlateCalcModal(startWeight){
  openModal('Calculateur de plaques',`
    <div class="field"><label>Poids total sur la barre (kg)</label><input type="number" id="plate-weight" value="${startWeight||''}" placeholder="100"></div>
    <div id="plate-result" style="font-size:14px;"></div>
  `,{onMount:(m)=>{
    const input=$('#plate-weight',m), out=$('#plate-result',m);
    function draw(){
      const total=Number(input.value)||0;
      const bar=20;
      let perSide=(total-bar)/2;
      if(perSide<=0){ out.innerHTML=`<div style="color:var(--text-dim);">Barre seule (${bar}kg) ${perSide<0?'— poids inférieur à la barre':''}</div>`; return; }
      const used=[];
      PLATE_SIZES.forEach(sz=>{
        let n=Math.floor(perSide/sz+1e-9);
        if(n>0){ used.push(`${n}× ${sz}kg`); perSide-=n*sz; }
      });
      out.innerHTML = `<div style="margin-bottom:6px;color:var(--text-dim);font-size:11.5px;">Par côté (barre 20kg) :</div>
        <div style="display:flex;flex-wrap:wrap;gap:6px;">${used.map(u=>`<span class="chip">${u}</span>`).join('')||'<span class="chip">—</span>'}</div>
        ${perSide>0.01?`<div style="margin-top:8px;font-size:11.5px;color:var(--danger);">Reste ${(perSide*2).toFixed(2)}kg impossibles à charger avec ces plaques</div>`:''}`;
    }
    input.addEventListener('input',draw);
    draw(); input.focus();
  }});
}
function cardioFormHTML(s){
  const c=s.cardio||{duration:'',distance:'',avgHr:'',score:'',notes:''};
  const sport=getSport(s.sportId);
  const isRacketOrTeam = sport.type==='racket' || sport.type==='team';

/* ---- rest timer ---- */
let REST_INTERVAL=null, REST_LEFT=0;
function startRestTimer(seconds){
  clearInterval(REST_INTERVAL);
  REST_LEFT=seconds;
  const box=$('#rest-timer');
  box.style.display='flex';
  updateRestDisplay();
  REST_INTERVAL=setInterval(()=>{
    REST_LEFT--;
    if(REST_LEFT<=0){ clearInterval(REST_INTERVAL); box.style.display='none'; beep(); return; }
    updateRestDisplay();
  },1000);
}
function updateRestDisplay(){
  const m=String(Math.floor(REST_LEFT/60)).padStart(2,'0');
  const sec=String(REST_LEFT%60).padStart(2,'0');
  $('#rest-timer-val').textContent=`${m}:${sec}`;
}
function beep(){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    [0,0.18,0.36].forEach(t=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type='sine'; o.frequency.value=880;
      o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.0001,ctx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(0.25,ctx.currentTime+t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+t+0.16);
      o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+0.18);
    });
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate([120,60,120]);
}
$('#rest-timer-skip').addEventListener('click',()=>{clearInterval(REST_INTERVAL);$('#rest-timer').style.display='none';});
$('#rest-timer-minus').addEventListener('click',()=>{REST_LEFT=Math.max(0,REST_LEFT-15);updateRestDisplay();});

function bindSessionEvents(){
  const s = ACTIVE_SESSION_ID ? getSession(ACTIVE_SESSION_ID) : null;

  const exitBtn=$('#exit-session'); if(exitBtn) exitBtn.addEventListener('click',()=>{ACTIVE_SESSION_ID=null;render();});

  bindProfileField('freeform-profile',document);
  const freeStart=$('#freeform-start');
  if(freeStart) freeStart.addEventListener('click',()=>{
    const sportId=$('#freeform-sport').value;
    const profileId=resolveProfileField('freeform-profile',document);
    if(!profileId){toast('Choisis ou crée un profil');return;}
    const sess={id:uid(),date:todayISO(),sportId,routineId:null,blockId:null,status:'planned',entries:[],cardio:null,notes:'',profileId};
    DB.sessions.push(sess); saveDB(); openSessionDetail(sess.id);
  });
  $$('[data-pick]').forEach(el=>el.addEventListener('click',()=>openSessionDetail(el.dataset.pick)));

  const mainPicker=$('#main-picker-tabs');
  if(mainPicker) bindExercisePickerTabs(document,'main-picker','pick-ex');
  const confirmEx=$('#confirm-exercises');
  if(confirmEx) confirmEx.addEventListener('click',()=>{
    const picked=$$('.pick-ex:checked').map(c=>{
      const variantSel=$(`.pick-ex-variant[data-for="${c.value}"]`);
      return variantSel? variantSel.value : c.value;
    });
    if(!picked.length){toast('Choisis au moins un exercice');return;}
    s.entries = picked.map(exId=>({exId,sets:[{weight:'',reps:'',rpe:'',bw:'',done:false},{weight:'',reps:'',rpe:'',bw:'',done:false},{weight:'',reps:'',rpe:'',bw:'',done:false}]}));
    saveDB(); render();
  });

  const addExBtn=$('#add-exercise-to-session');
  if(addExBtn) addExBtn.addEventListener('click',()=>{
    const roots=sortExercisesByCategory(DB.exercises.filter(e=>e.sportId===s.sportId && !e.variantOf));
    openModal('Ajouter un exercice',`
    ${exercisePickerTabsHTML(roots,'add-picker','add-ex')}
    <button class="btn btn-ghost btn-sm" id="quick-create-exercise-2" style="margin-top:12px;">+ Créer un nouvel exercice</button>
    <button class="btn btn-primary" id="confirm-add-ex" style="margin-top:10px;">Ajouter à la séance</button>`,{onMount:(m)=>{
      bindExercisePickerTabs(m,'add-picker','add-ex');
      $('#confirm-add-ex',m).addEventListener('click',()=>{
        const picked=$$('.add-ex:checked',m).map(c=>{
          const variantSel=$(`.add-ex-variant[data-for="${c.value}"]`,m);
          return variantSel? variantSel.value : c.value;
        });
        if(!picked.length){toast('Choisis au moins un exercice');return;}
        picked.forEach(exId=>s.entries.push({exId,sets:[{weight:'',reps:'',rpe:'',bw:'',done:false},{weight:'',reps:'',rpe:'',bw:'',done:false},{weight:'',reps:'',rpe:'',bw:'',done:false}]}));
        saveDB(); closeModal(); render();
      });
      $('#quick-create-exercise-2',m).addEventListener('click',()=>{
        openQuickExerciseModal(s.sportId,(newEx)=>{
          s.entries.push({exId:newEx.id,sets:[{weight:'',reps:'',rpe:'',bw:'',done:false},{weight:'',reps:'',rpe:'',bw:'',done:false},{weight:'',reps:'',rpe:'',bw:'',done:false}]});
          saveDB(); closeModal(); render();
        });
      });
    }});
  });
  const quickCreateBtn=$('#quick-create-exercise');
  if(quickCreateBtn) quickCreateBtn.addEventListener('click',()=>{
    const alreadyPicked=$$('.pick-ex:checked').map(c=>{
      const variantSel=$(`.pick-ex-variant[data-for="${c.value}"]`);
      return variantSel? variantSel.value : c.value;
    });
    openQuickExerciseModal(s.sportId,(newEx)=>{
      const ids=[...alreadyPicked,newEx.id];
      s.entries = ids.map(exId=>({exId,sets:[{weight:'',reps:'',rpe:'',bw:'',done:false},{weight:'',reps:'',rpe:'',bw:'',done:false},{weight:'',reps:'',rpe:'',bw:'',done:false}]}));
      saveDB(); render();
    });
  });

  $$('[data-add-set]').forEach(b=>b.addEventListener('click',()=>{
    const idx=+b.dataset.addSet; s.entries[idx].sets.push({weight:'',reps:'',rpe:'',bw:'',done:false}); saveDB(); render();
  }));
  $$('[data-remove-ex]').forEach(b=>b.addEventListener('click',()=>{
    const idx=+b.dataset.removeEx; s.entries.splice(idx,1); saveDB(); render();
  }));
  $$('.set-input').forEach(inp=>inp.addEventListener('input',()=>{
    const tr=inp.closest('tr'); const exIdx=+tr.dataset.ex, setIdx=+tr.dataset.set;
    s.entries[exIdx].sets[setIdx][inp.dataset.field]=inp.value;
    if(inp.dataset.field==='weight') s.entries[exIdx].sets[setIdx].autoFilled=false;
    saveDB();
    const bestEl=tr.closest('.ex-card').querySelector('.best');
    const best=s.entries[exIdx].sets.reduce((m,st)=>Math.max(m,est1RM(st.weight,st.reps)),0);
    bestEl.textContent = best>0? '1RM est. ~'+Math.round(best)+'kg' : '';
  }));
  $$('[data-toggle-done]').forEach(btn=>btn.addEventListener('click',()=>{
    const tr=btn.closest('tr'); const exIdx=+tr.dataset.ex, setIdx=+tr.dataset.set;
    const st=s.entries[exIdx].sets[setIdx];
    st.done=!st.done; saveDB();
    tr.classList.toggle('done',st.done);
    if(st.done) startRestTimer(DB.settings.restDefault||90);
  }));

  ['c-duration','c-distance','c-hr','c-score','c-notes'].forEach(id=>{
    const el=$('#'+id); if(!el) return;
    el.addEventListener('input',()=>{
      if(!s.cardio) s.cardio={duration:'',distance:'',avgHr:'',score:'',notes:''};
      const key={ 'c-duration':'duration','c-distance':'distance','c-hr':'avgHr','c-score':'score','c-notes':'notes'}[id];
      s.cardio[key]=el.value; saveDB();
      const speedEl=$('#c-speed'); if(speedEl && s.cardio.duration && s.cardio.distance) speedEl.value=(s.cardio.distance/(s.cardio.duration/60)).toFixed(1);
    });
  });

  const notesEl=$('#sess-notes'); if(notesEl) notesEl.addEventListener('input',()=>{s.notes=notesEl.value;saveDB();});

  $$('[data-apply-suggestion]').forEach(b=>b.addEventListener('click',()=>{
    const idx=+b.dataset.applySuggestion, w=b.dataset.suggWeight;
    const target = s.entries[idx].sets.find(st=>!st.weight) || s.entries[idx].sets[0];
    target.weight=w; saveDB(); render();
  }));
  $$('[data-goal-ex]').forEach(b=>b.addEventListener('click',()=>openGoalModal(b.dataset.goalEx)));
  $$('[data-replace-ex]').forEach(b=>b.addEventListener('click',()=>{
    const idx=+b.dataset.replaceEx;
    openReplaceExerciseModal(s,idx);
  }));
  $$('[data-plate-calc]').forEach(b=>b.addEventListener('click',()=>{
    const tr=b.closest('tr');
    const weightInput=tr.querySelector('.set-input[data-field="weight"]');
    openPlateCalcModal(weightInput?weightInput.value:'');
  }));

  const missBtn=$('#mark-missed');
  if(missBtn) missBtn.addEventListener('click',()=>{ s.status='missed'; saveDB(); toast('Séance marquée manquée'); ACTIVE_SESSION_ID=null; navigate('dashboard'); });
  const finBtn=$('#finish-session');
  if(finBtn) finBtn.addEventListener('click',()=>{
    s.status='done'; s.cardio && (s.cardio.distance=Number(s.cardio.distance)||0);
    saveDB(); toast('Séance terminée 💪'); ACTIVE_SESSION_ID=null; navigate('dashboard');
  });
  const delBtn=$('#delete-session');
  if(delBtn) delBtn.addEventListener('click',()=>{
    if(!confirm('Supprimer définitivement cette séance ?'))return;
    DB.sessions=DB.sessions.filter(x=>x.id!==s.id); saveDB(); toast('Séance supprimée'); ACTIVE_SESSION_ID=null; navigate('dashboard');
  });
  const dupBtn=$('#duplicate-session');
  if(dupBtn) dupBtn.addEventListener('click',()=>duplicateSessionFlow(s));
}
function duplicateSessionFlow(s){
  openModal('Dupliquer cette séance',`
    <div class="field"><label>Nouvelle date</label><input type="date" id="dup-date" value="${addDays(todayISO(),0)}"></div>
    <button class="btn btn-primary" id="dup-confirm">Dupliquer</button>
  `,{onMount:(m)=>{
    $('#dup-confirm',m).addEventListener('click',()=>{
      const date=$('#dup-date',m).value;
      const copy=JSON.parse(JSON.stringify(s));
      copy.id=uid(); copy.date=date; copy.status='planned';
      (copy.entries||[]).forEach(ex=>ex.sets.forEach(st=>{st.done=false;}));
      DB.sessions.push(copy); saveDB(); closeModal(); toast('Séance dupliquée au '+fmtDate(date,{short:true})); render();
    });
  }});
}

  `;

function blockCalendarHTML(b){
  const weeks=[]; let cursor=startOfWeek(b.startDate);
  const lastWeek=startOfWeek(b.endDate);
  while(cursor<=lastWeek){ weeks.push(cursor); cursor=addDays(cursor,7); }
  return weeks.map(wStart=>{
    let row='';
    for(let i=0;i<7;i++){
      const iso=addDays(wStart,i);
      const inBlock = iso>=b.startDate && iso<=b.endDate;
      if(!inBlock){ row+=`<div class="cal-day other-month" style="visibility:hidden;"></div>`; continue; }
      const isToday=iso===todayISO();
      const daySessions=DB.sessions.filter(s=>s.date===iso && s.blockId===b.id);
      row+=`<div class="cal-day ${isToday?'today':''}" data-day="${iso}" data-block-day="${b.id}" style="cursor:pointer;">
        <span>${Number(iso.slice(8,10))}</span>
        <div class="pills">${daySessions.slice(0,4).map(s=>{const sp=getSport(s.sportId);return `<span class="cal-pill-dot" style="background:${s.status==='missed'?'var(--danger)':(sp?sp.color:'#888')};opacity:${s.status==='planned'?.5:1}"></span>`;}).join('')}</div>
      </div>`;
    }
    return `<div class="cal-grid" style="margin-bottom:5px;">${row}</div>`;
  }).join('');
}

const BLOCK_COLORS=['#EF4444','#F97316','#F59E0B','#EAB308','#84CC16','#22C55E','#10B981','#14B8A6','#06B6D4','#0EA5E9','#3B82F6','#6366F1','#8B5CF6','#A855F7','#D946EF','#EC4899','#F43F5E','#78716C','#64748B','#0A0A0A'];

/* Sélecteur de couleur : palette étendue (teintes variées + nuances de gris) présentée sous
   forme de pastilles cliquables, plus un sélecteur libre (input type="color") pour choisir
   absolument n'importe quelle teinte. */
function grayscalePickerHTML(id, selected){
  const val = selected || BLOCK_COLORS[0];
  const isPreset = BLOCK_COLORS.includes(val);
  return `<input type="hidden" id="${id}" value="${val}">
  <div class="tag-wrap" id="${id}-swatches">${BLOCK_COLORS.map(c=>`<button type="button" class="gs-swatch ${c===val?'active':''}" data-color="${c}" style="background:${c};" title="${c}"></button>`).join('')}<label class="gs-swatch gs-swatch-custom ${!isPreset?'active':''}" id="${id}-custom-label" style="background:${!isPreset?val:'conic-gradient(red,yellow,lime,cyan,blue,magenta,red)'};" title="Couleur personnalisée"><input type="color" id="${id}-custom" value="${isPreset?'#888888':val}" style="opacity:0;width:100%;height:100%;cursor:pointer;"></label></div>`;
}
function bindGrayscalePicker(id, m){
  const hidden=$('#'+id,m);
  const presetBtns=()=>$$('#'+id+'-swatches .gs-swatch[data-color]',m);
  presetBtns().forEach(btn=>btn.addEventListener('click',()=>{
    hidden.value=btn.dataset.color;
    presetBtns().forEach(b=>b.classList.toggle('active',b===btn));
    const customLabel=$('#'+id+'-custom-label',m);
    if(customLabel) customLabel.classList.remove('active');
  }));
  const customInput=$('#'+id+'-custom',m);
  const customLabel=$('#'+id+'-custom-label',m);
  if(customInput&&customLabel){
    customInput.addEventListener('input',()=>{
      hidden.value=customInput.value;
      customLabel.style.background=customInput.value;
      customLabel.classList.add('active');
      presetBtns().forEach(b=>b.classList.remove('active'));
    });
  }
}

/* Transfert d'une routine vers un autre profil du même appareil : lit et réécrit
   directement le silo localStorage du profil cible (loadProfileData/localStorage.setItem)
   SANS jamais charger ses autres données en mémoire dans DB — le profil actif ne voit
   et ne touche à aucun moment aux données personnelles de l'autre profil, seule la
   routine copiée y est ajoutée. La routine reste aussi dans le profil d'origine. */
function openTransferRoutineModal(routineId){
  const r=getRoutine(routineId); if(!r) return;
  const targets=(GLOBAL.profiles||[]).filter(p=>p.id!==CURRENT_PROFILE_ID);
  if(!targets.length){ toast('Aucun autre profil sur cet appareil'); return; }
  openModal('Transférer "'+r.name+'"',`
    <div style="font-size:12.5px;color:var(--text-dim);margin-bottom:12px;">Une copie de cette routine sera ajoutée au profil choisi (elle reste aussi dans ${profileName(CURRENT_PROFILE_ID)}).</div>
    <div id="transfer-target-list">
    ${targets.map(p=>`<button type="button" class="list-item" data-transfer-target="${p.id}" style="width:100%;background:none;border:none;cursor:pointer;text-align:left;">
      <div class="swatch" style="background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;border-radius:50%;">${initial2(p.name)}</div>
      <div class="main"><div class="title">${p.name}</div></div>
    </button>`).join('')}
    </div>
  `,{onMount:(m)=>{
    $$('[data-transfer-target]',m).forEach(b=>b.addEventListener('click',()=>{
      const targetId=b.dataset.transferTarget;
      const pd=loadProfileData(targetId);
      const copy=JSON.parse(JSON.stringify(r));
      copy.id=uid();
      copy.blockId=null; /* un bloc est propre à un profil : la copie en est détachée */
      pd.routines.push(copy);
      localStorage.setItem(profileStorageKey(targetId), JSON.stringify(pd));
      closeModal();
      toast('Routine transférée vers '+profileName(targetId));
    }));
  }});
}

      <div class="tabs-sub" style="flex-wrap:wrap;">${cats.map((c,i)=>`<button type="button" data-lib-tab="${c}" class="${i===0?'active':''}">${c}</button>`).join('')}</div>
      <div class="ex-lib-panels">
      ${cats.map((c,i)=>`<div class="ex-grid" data-lib-panel="${c}" style="display:${i===0?'grid':'none'};">${byCat[c].map(rowHTML).join('')}</div>`).join('')}
      </div>`}

  }).join('')}
