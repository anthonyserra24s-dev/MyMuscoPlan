}
/* Modale unique pour créer OU modifier un exercice (édition : passer l'exercice existant).
   Classification par patron de mouvement + muscle principal (agoniste) + muscles secondaires
   (synergistes, multi-tags) : plus robuste que l'ancienne "zone" pour les mouvements
   polyarticulaires (Soulevé de terre, Muscle-up...) qui recrutent plusieurs groupes à la fois. */
function variantOfOptionsHTML(sportId, selectedId, excludeId){
  const roots=DB.exercises.filter(e=>e.sportId===sportId && !e.variantOf && e.id!==excludeId);
  return `<option value="">— Aucune (exercice normal) —</option>`+sortExercisesByCategory(roots).map(e=>`<option value="${e.id}" ${e.id===selectedId?'selected':''}>${e.name}</option>`).join('');
}
function openExerciseModal(existing){
  const editing=!!existing;
  const ex=existing||{};
  openModal(editing?'Modifier l\'exercice':'Nouvel exercice',`
    <div class="field"><label>Nom</label><input id="exf-name" value="${ex.name?ex.name.replace(/"/g,'&quot;'):''}" placeholder="Ex: Rowing barre"></div>
    <div class="field"><label>Sport</label><select id="exf-sport">${DB.sports.map(s=>`<option value="${s.id}" ${ex.sportId===s.id?'selected':''}>${s.name}</option>`).join('')}</select></div>
    <div class="field"><label>Variante de (optionnel)</label><select id="exf-variant-of">${variantOfOptionsHTML(ex.sportId||(DB.sports[0]||{}).id,ex.variantOf||'',ex.id)}</select></div>
    <div id="exf-cat-wrap" class="field"><label>Catégorie</label><select id="exf-cat">${exerciseCategoryOptionsHTML(ex.category)}</select></div>
    <div class="field"><label>Muscles principaux</label>${multiMusclePickerHTML('exf-primary', muscleArr(ex))}</div>
    <label style="display:flex;align-items:center;gap:8px;margin:2px 0 4px;"><input type="checkbox" id="exf-poly" style="width:18px;height:18px;flex-shrink:0;"><span>Mouvement polyarticulaire</span></label>
    <div style="font-size:11px;color:var(--text-faint);margin-bottom:10px;">Coché automatiquement si plusieurs muscles principaux sont sélectionnés — décoche/coche pour corriger manuellement (ex: Curl marteau = biceps + avant-bras mais reste isolation).</div>
    <div id="exf-batch-variants-wrap" class="field">
      <label>Variantes (optionnel)</label>
      <div id="exf-variant-chips" class="tag-wrap" style="margin-bottom:8px;"></div>
      <div class="row"><input id="exf-variant-input" placeholder="Ex: Posé, Tempo, Lesté..." style="flex:1;"><button type="button" class="btn btn-secondary btn-sm" id="exf-variant-add" style="flex:0 0 auto;">Ajouter</button></div>
    </div>
    <button class="btn btn-primary" id="exf-save" style="margin-top:6px;">${editing?'Enregistrer':'Ajouter'}</button>
    ${editing?`<button class="btn btn-danger" id="exf-delete" style="margin-top:10px;">Supprimer cet exercice</button>`:''}
  `,{onMount:(m)=>{
    $('#exf-name',m).focus();
    bindMultiMusclePicker('exf-primary',m);
    /* Case "polyarticulaire" : initialisée à la classification actuelle (auto ou forcée),
       puis ré-alignée automatiquement sur le nombre de muscles tant que l'utilisateur ne l'a
       pas corrigée lui-même dans cette session d'édition (polyTouched). */
    const polyChk=$('#exf-poly',m);
    let polyTouched=false;
    polyChk.checked = isPolyarticular(ex);
    polyChk.addEventListener('change',()=>{ polyTouched=true; });
    $$('#exf-primary-chips .chip-toggle',m).forEach(btn=>btn.addEventListener('click',()=>{
      if(polyTouched) return;
      const n=$$('#exf-primary-chips .chip-toggle.active',m).length;
      polyChk.checked = n>1;
    }));
    let pending=[]; // variantes pas encore enregistrées (mode création uniquement)
    function refreshVariantOfOptions(){
      $('#exf-variant-of',m).innerHTML=variantOfOptionsHTML($('#exf-sport',m).value, $('#exf-variant-of',m).value, ex.id);
    }
    function syncVariantMode(){
      const isNowVariant=!!$('#exf-variant-of',m).value;
      $('#exf-cat-wrap',m).style.display=isNowVariant?'none':'';
      $('#exf-batch-variants-wrap',m).style.display=isNowVariant?'none':'';
      if(isNowVariant){ pending=[]; renderChips(); }
    }
    $('#exf-sport',m).addEventListener('change',()=>{ refreshVariantOfOptions(); syncVariantMode(); });
    $('#exf-variant-of',m).addEventListener('change',syncVariantMode);
    syncVariantMode();
    function renderChips(){
      const existingVariants = editing? DB.exercises.filter(v=>v.variantOf===ex.id) : [];
      const existingHTML = existingVariants.map(v=>`<span class="chip">${v.name}<button type="button" data-rm-existing="${v.id}" style="background:none;border:none;color:var(--text-dim);cursor:pointer;margin-left:2px;">✕</button></span>`).join('');
      const pendingHTML = pending.map((n,i)=>`<span class="chip">${n}<button type="button" data-rm-pending="${i}" style="background:none;border:none;color:var(--text-dim);cursor:pointer;margin-left:2px;">✕</button></span>`).join('');
      $('#exf-variant-chips',m).innerHTML = existingHTML+pendingHTML;
      $$('[data-rm-existing]',m).forEach(b=>b.addEventListener('click',()=>{
        if(!confirm('Supprimer cette variante ?'))return;
        DB.exercises=DB.exercises.filter(x=>x.id!==b.dataset.rmExisting); saveDB(); renderChips();
      }));
      $$('[data-rm-pending]',m).forEach(b=>b.addEventListener('click',()=>{ pending.splice(+b.dataset.rmPending,1); renderChips(); }));
    }
    renderChips();
    function addVariant(){
      const input=$('#exf-variant-input',m); const name=input.value.trim();
      if(!name) return;
      if(editing){
        DB.exercises.push({id:uid(),name,sportId:ex.sportId,category:$('#exf-cat',m).value,primaryMuscle:$('#exf-primary',m).value.split(',').filter(Boolean),variantOf:ex.id});
        saveDB();
      } else { pending.push(name); }
      input.value=''; renderChips(); input.focus();
    }
    $('#exf-variant-add',m).addEventListener('click',addVariant);
    $('#exf-variant-input',m).addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); addVariant(); } });
    $('#exf-save',m).addEventListener('click',()=>{
      const name=$('#exf-name',m).value.trim(); if(!name){toast('Nom requis');return;}
      const variantOfVal=$('#exf-variant-of',m).value||null;
      const parentEx=variantOfVal?getExercise(variantOfVal):null;
      const category=parentEx?parentEx.category:$('#exf-cat',m).value;
      const primaryMuscle=$('#exf-primary',m).value.split(',').filter(Boolean);
      /* On ne stocke un override explicite que si la case diverge de la détection auto
         (>1 muscle = polyarticulaire) — sinon on laisse polyarticular=null pour que la
         classification continue de suivre les muscles si l'exercice est modifié plus tard. */
      const autoPoly=primaryMuscle.length>1;
      const polyChecked=$('#exf-poly',m).checked;
      const polyarticular = polyChecked===autoPoly ? null : polyChecked;
      const data={name,sportId:$('#exf-sport',m).value,category,primaryMuscle,polyarticular,variantOf:variantOfVal};
      if(editing){
        delete ex.zone; delete ex.region; delete ex.muscle; delete ex.pattern; delete ex.secondaryMuscles;
        Object.assign(ex,data);
      } else {
        const newEx=Object.assign({id:uid()},data);
        DB.exercises.push(newEx);
        pending.forEach(vn=>DB.exercises.push({id:uid(),name:vn,sportId:data.sportId,category:data.category,primaryMuscle:data.primaryMuscle,variantOf:newEx.id}));
      }
      saveDB(); closeModal(); toast(editing?'Exercice modifié':'Exercice créé'); render();
    });
    if(editing){
      $('#exf-delete',m).addEventListener('click',()=>{
        if(!confirm('Supprimer cet exercice ? Ses variantes éventuelles seront détachées.'))return;
        DB.exercises.forEach(e=>{ if(e.variantOf===ex.id) e.variantOf=null; });
        DB.exercises=DB.exercises.filter(x=>x.id!==ex.id); saveDB(); closeModal(); toast('Exercice supprimé'); render();
      });
    }
  }});
}

        $$('[data-lib-row]',root).forEach(r=>r.style.display='');

function duplicateBlock(b){
  openModal('Dupliquer "'+b.name+'"',`
    <div class="field"><label>Nouvelle date de début</label><input type="date" id="dupb-start" value="${addDays(b.endDate,1)}"></div>
    <label style="display:flex;align-items:center;gap:8px;margin-bottom:16px;"><input type="checkbox" id="dupb-routines" style="width:18px;height:18px;"> Dupliquer aussi les routines de sa semaine type (copies indépendantes)</label>
    <button class="btn btn-primary" id="dupb-confirm">Dupliquer le bloc</button>
  `,{onMount:(m)=>{
    $('#dupb-confirm',m).addEventListener('click',()=>{
      const newStart=$('#dupb-start',m).value;
      const durationDays=isoWeeksBetween(b.startDate,b.endDate)*7 || Math.round((new Date(b.endDate)-new Date(b.startDate))/864e5);
      const newEnd=addDays(newStart,durationDays);
      const newBlock={id:uid(),name:b.name+' (copie)',blockType:b.blockType,startDate:newStart,endDate:newEnd,sportIds:[...(b.sportIds||[])],notes:b.notes,color:nextBlockColor(),profileId:b.profileId,weeklyPlan:{},autoProgression:JSON.parse(JSON.stringify(b.autoProgression||{enabled:false,mode:'percent',value:2.5}))};
      if($('#dupb-routines',m).checked){
        const routineMap={};
        const usedIds=new Set(Object.values(b.weeklyPlan||{}).flat());
        usedIds.forEach(rid=>{
          const r=getRoutine(rid); if(!r) return;
          const copy=JSON.parse(JSON.stringify(r)); copy.id=uid(); copy.name=r.name+' (copie)';
          routineMap[rid]=copy.id; DB.routines.push(copy);
        });
        Object.entries(b.weeklyPlan||{}).forEach(([day,ids])=>{ newBlock.weeklyPlan[day]=ids.map(rid=>routineMap[rid]||rid); });
      } else {
        newBlock.weeklyPlan=JSON.parse(JSON.stringify(b.weeklyPlan||{}));
      }
      DB.blocks.push(newBlock); saveDB(); closeModal(); toast('Bloc dupliqué'); render();
    });
  }});
}
function openWeekPlanModal(b){
  const days=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
  const plan=b.weeklyPlan||{};
  const ap=b.autoProgression||{enabled:false,mode:'percent',value:2.5};
  const routineOpts=(dayIdx)=>{
    const sel=(plan[dayIdx]||[])[0]||'';
    return `<option value="">— Repos —</option>${DB.routines.map(r=>`<option value="${r.id}" ${sel===r.id?'selected':''}>${r.name}</option>`).join('')}`;
  };
  openModal('Semaine type — '+b.name,`
    <div style="font-size:12px;color:var(--text-dim);margin-bottom:14px;">Définis quelle routine revient chaque jour de la semaine, puis génère les séances sur toute la durée du bloc.</div>
    ${days.map((d,i)=>`<div class="field"><label>${d}</label><select class="wk-day" data-day="${i}">${routineOpts(i)}</select><div class="wk-preview" data-preview="${i}">${routineDetailHTML((plan[i]||[])[0]||'')}</div></div>`).join('')}
    <div class="section-title">Surcharge progressive automatique</div>
    <label style="display:flex;align-items:center;gap:8px;margin-bottom:10px;"><input type="checkbox" id="wk-ap-enabled" ${ap.enabled?'checked':''} style="width:18px;height:18px;"> Activer l'incrémentation automatique des charges</label>
    <div class="row">
      <div class="field"><label>Type</label><select id="wk-ap-mode"><option value="percent" ${ap.mode==='percent'?'selected':''}>Pourcentage / semaine</option><option value="fixed" ${ap.mode==='fixed'?'selected':''}>Kg fixes / semaine</option></select></div>
      <div class="field"><label>Valeur</label><input type="number" step="0.5" id="wk-ap-value" value="${ap.value}"></div>
    </div>
    <div style="font-size:11px;color:var(--text-faint);margin-bottom:14px;">Les charges suggérées (placeholders) sur les séances générées augmenteront chaque semaine par rapport à ta dernière performance connue.</div>
    <button class="btn btn-primary" id="wk-generate" style="margin-top:6px;">Générer les séances du bloc</button>
  `,{onMount:(m)=>{
    $$('.wk-day',m).forEach(sel=>sel.addEventListener('change',()=>{
      m.querySelector(`[data-preview="${sel.dataset.day}"]`).innerHTML=routineDetailHTML(sel.value);
    }));
    $('#wk-generate',m).addEventListener('click',()=>{
      const newPlan={};
      $$('.wk-day',m).forEach(sel=>{ if(sel.value) newPlan[sel.dataset.day]=[sel.value]; });
      b.weeklyPlan=newPlan;
      b.autoProgression={enabled:$('#wk-ap-enabled',m).checked,mode:$('#wk-ap-mode',m).value,value:Number($('#wk-ap-value',m).value)||0};
      saveDB();
      let created=0, skipped=0;
      let cursor=b.startDate;
      while(cursor<=b.endDate){
        const dow=(new Date(cursor+'T00:00:00').getDay()+6)%7;
        const routineIds=newPlan[dow]||[];
        routineIds.forEach(rid=>{
          const already=DB.sessions.some(s=>s.date===cursor && s.routineId===rid);
          if(already){ skipped++; return; }
          const r=getRoutine(rid); if(!r) return;
          const entries=buildEntriesFromRoutine(r.id, cursor, b.profileId);
          DB.sessions.push({id:uid(),date:cursor,sportId:r.sportId,routineId:r.id,blockId:b.id,status:'planned',entries,cardio:null,notes:'',profileId:b.profileId});
          created++;
        });
        cursor=addDays(cursor,1);
      }
      saveDB(); closeModal(); toast(`${created} séance(s) générée(s)${skipped?', '+skipped+' déjà existante(s) ignorée(s)':''}`); render();
    });
  }});
}

/* ---- Progression: volume hebdo + charge réelle sur exercice clé + km cumulés ----
   NOTE NOMMAGE : ce conteneur de page s'appelle renderProgressionTab() (et non renderProgression())
   pour ne pas casser le point d'appel existant dans renderStats() — c'est la fonction demandée
   "renderProgression()" en pratique : elle assemble la page Progression complète. */
function renderProgressionTab(){
  const weeks=lastNWeeks(10);
  const volBySport={};
  DB.sports.forEach(sp=>volBySport[sp.id]=weeks.map(w=>DB.sessions.filter(s=>s.status==='done'&&s.sportId===sp.id&&weekKey(s.date)===w).reduce((sum,s)=>sum+sessionVolume(s),0)));
  /* Sélection en cascade : d'abord l'exercice RACINE (liste courte, groupée par catégorie),
     puis sa variante ("Normal" + variantes) dans un second select — on ne montre plus toutes
     les variantes à plat dans une seule liste. */
  const strengthRoots=sortExercisesByCategory(DB.exercises.filter(e=>!e.variantOf && ['strength','mixed'].includes(getSport(e.sportId)?.type)));
  const selectedEx0=(STATS_SELECTED_EX && getExercise(STATS_SELECTED_EX)) ? getExercise(STATS_SELECTED_EX) : null;
  const selectedRootId=(selectedEx0 ? (selectedEx0.variantOf||selectedEx0.id) : (strengthRoots[0]&&strengthRoots[0].id));
  const selectedExId=(selectedEx0 && (selectedEx0.variantOf||selectedEx0.id)===selectedRootId) ? selectedEx0.id : selectedRootId;
  const formats = selectedExId ? availableFormats(selectedExId) : [];
  const selectedFormat = (formats.find(f=>f.key===STATS_SELECTED_FORMAT) || formats[0] || null);
  const kmSeries = weeks.map(w=>DB.sessions.filter(s=>s.status==='done'&&s.cardio&&weekKey(s.date)===w).reduce((sum,s)=>sum+(Number(s.cardio.distance)||0),0));
  return `
  <div class="card">
    <div class="card-header"><h2>Volume hebdomadaire (kg soulevés)</h2></div>
    ${barChart(weeks.map(w=>fmtDate(w,{short:true})), Object.entries(volBySport).filter(([,v])=>v.some(x=>x>0)).map(([sid,v])=>({label:getSport(sid).name,color:getSport(sid).color,values:v})))}
  </div>
  <div class="card">
    <div class="card-header"><h2>Charge sur exercice clé</h2></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;">
      <select id="stat-ex-select" style="width:auto;font-size:12px;padding:6px 8px;">${statsRootOptionsHTML(strengthRoots, selectedRootId)}</select>
      <select id="stat-variant-select" style="width:auto;font-size:12px;padding:6px 8px;">${variantOptionsHTML(selectedRootId, selectedExId)}</select>
      ${formats.length?`<select id="stat-format-select" style="width:auto;font-size:12px;padding:6px 8px;">${formats.map(f=>`<option value="${f.key}" ${selectedFormat&&f.key===selectedFormat.key?'selected':''}>${f.setsCount}×${f.repsCount}</option>`).join('')}</select>`:''}
    </div>
    ${renderKeyExerciseChart(selectedExId, selectedFormat?selectedFormat.key:null)}
  </div>
  <div class="card">
    <div class="card-header"><h2>Kilométrage cumulé</h2></div>
    ${barChart(weeks.map(w=>fmtDate(w,{short:true})), [{label:'Km',color:'#71717A',values:kmSeries}])}
  </div>
  `;
}
/* Options du select "Exercice" (racines uniquement, groupées par catégorie) pour la page Progression. */
function statsRootOptionsHTML(roots, selectedRootId){
  let html='', curCat=null;
  roots.forEach(e=>{
    const cat=exerciseCategory(e);
    if(cat!==curCat){ if(curCat!==null) html+='</optgroup>'; html+=`<optgroup label="${cat}">`; curCat=cat; }
    html+=`<option value="${e.id}" ${e.id===selectedRootId?'selected':''}>${e.name}</option>`;
  });
  if(curCat!==null) html+='</optgroup>';
  return html;
}
let STATS_SELECTED_EX=null;
let STATS_SELECTED_FORMAT=null;

/* Renvoie, pour un exId EXACT (exercice + variante précise, pas la racine), tous les points
   de charge RÉELLE (kg réellement soulevés, pas de 1RM estimé) issus des séances validées,
   avec le "format" [nombre de séries validées x nombre de reps dominant] de chaque séance.
   Deux formats différents (5x5 vs 4x5, ou une autre variante) ne se mélangent JAMAIS : le tri
   par format se fait ensuite dans availableFormats()/renderKeyExerciseChart(). */
function exerciseFormatPoints(exId){
  const out=[];
  [...DB.sessions].filter(s=>s.status==='done').sort((a,b)=>a.date.localeCompare(b.date)).forEach(s=>{
    (s.entries||[]).forEach(ex=>{
      if(ex.exId!==exId) return;
      const done=(ex.sets||[]).filter(st=>st.done && (Number(st.weight)||0)>0 && (Number(st.reps)||0)>0);
      if(!done.length) return;
      const setsCount=done.length;
      const repsCount=modeValue(done.map(st=>Number(st.reps)));
      const weight=Math.max(...done.map(st=>Number(st.weight))); // charge réelle max de la séance pour ce format
      out.push({date:s.date, setsCount, repsCount, weight});
    });
  });
  return out;
}
/* Valeur la plus fréquente d'un tableau (ex: reps dominantes d'une séance en 5x5 -> 5) */
function modeValue(arr){
  const freq={}; let best=arr[0], bestCount=0;
  arr.forEach(v=>{ freq[v]=(freq[v]||0)+1; if(freq[v]>bestCount){bestCount=freq[v];best=v;} });
  return best;
}
function formatKey(setsCount,repsCount){ return `${setsCount}x${repsCount}`; }
/* Liste des formats [séries x reps] réellement enregistrés pour un exId exact, triés du plus
   fréquent au plus récent en cas d'égalité — sert à peupler le filtre "format" du graphique. */
function availableFormats(exId){
  const map={};
  exerciseFormatPoints(exId).forEach(p=>{
    const k=formatKey(p.setsCount,p.repsCount);
    if(!map[k]) map[k]={key:k,setsCount:p.setsCount,repsCount:p.repsCount,count:0};
    map[k].count++;
  });
  return Object.values(map).sort((a,b)=> b.count-a.count || a.setsCount-b.setsCount || a.repsCount-b.repsCount);
}
function lastNWeeks(n){
  const cur=weekKey(todayISO()); const arr=[];
  for(let i=n-1;i>=0;i--) arr.push(addDays(cur,-7*i));
  return arr;
}
function barChart(labels,series){
  if(!series.length) return `<div class="empty-state" style="padding:20px 4px;"><div class="d">Pas encore de données. Termine des séances pour voir ta progression.</div></div>`;
  const W=Math.max(320,labels.length*46), H=150, padB=20, padT=10;
  const allVals=series.flatMap(s=>s.values);
  const max=Math.max(1,...allVals);
  const groupW=(W-20)/labels.length;
  const barW=Math.min(14,(groupW-8)/series.length);
  let bars='';
  labels.forEach((lb,i)=>{
    const gx=10+i*groupW;
    series.forEach((s,si)=>{
      const v=s.values[i]||0;
      const h=(v/max)*(H-padB-padT);
      const x=gx+si*(barW+3);
      bars+=`<rect x="${x}" y="${H-padB-h}" width="${barW}" height="${h}" rx="3" fill="${s.color}"><title>${s.label}: ${Math.round(v)}</title></rect>`;
    });
    bars+=`<text x="${gx+groupW/2-5}" y="${H-4}" font-size="9" fill="var(--text-faint,#565b66)" text-anchor="middle">${lb}</text>`;
  });
  return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="min-width:${W}px;">${bars}</svg></div>
  <div class="legend">${series.map(s=>`<div class="li"><span class="sw" style="background:${s.color}"></span>${s.label}</div>`).join('')}</div>`;
}
/* Graphique "Charge sur exercice clé" — CHARGE RÉELLE (kg), jamais de 1RM estimé, filtré sur
   un combiné EXACT [exId (exercice+variante)] x [format séries×reps]. Les 3 cas (0 / 1 / >=2
   points) sont gérés séparément comme demandé. */
function renderKeyExerciseChart(exId, fmtKey){
  if(!exId) return `<div class="empty-state" style="padding:24px 4px;"><div class="d">Aucun exercice de force enregistré.</div></div>`;
  const formats=availableFormats(exId);
  if(!formats.length) return `<div class="empty-state" style="padding:24px 4px;"><div class="d">Aucune donnée enregistrée pour ce format</div></div>`;
  const fmt = formats.find(f=>f.key===fmtKey) || formats[0];
  const points = exerciseFormatPoints(exId).filter(p=>p.setsCount===fmt.setsCount && p.repsCount===fmt.repsCount);

  /* Cas 0 donnée */
  if(!points.length){
    return `<div class="empty-state" style="padding:24px 4px;"><div class="d">Aucune donnée enregistrée pour ce format</div></div>`;
  }
  /* Cas 1 seule donnée : point centré, date + poids affichés, message d'invitation */
  if(points.length===1){
    const p=points[0];
    return `<div class="chart-wrap" style="min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;">
      <svg viewBox="0 0 40 40" width="40" height="40"><circle cx="20" cy="20" r="6" fill="var(--accent,#18181B)"/></svg>
      <div class="mono" style="font-size:16px;font-weight:700;">${p.weight}kg</div>
      <div style="font-size:11px;color:var(--text-dim);">${fmtDate(p.date,{short:true})}</div>
      <div class="d" style="text-align:center;max-width:240px;font-size:12px;color:var(--text-faint);margin-top:2px;">Enregistre une autre séance dans ce format pour voir ton évolution</div>
    </div>`;
  }

  /* Cas >=2 données : axes X/Y, grille discrète, dégradé sous la courbe */
  const W=Math.max(340, points.length*54), H=180, padL=34, padR=14, padT=24, padB=26;
  const weights=points.map(p=>p.weight);
  const rawMin=Math.min(...weights), rawMax=Math.max(...weights);
  const span=Math.max(1, rawMax-rawMin);
  const min=Math.max(0, rawMin - span*0.15 - 2);
  const max=rawMax + span*0.15 + 2;
  const stepX=(W-padL-padR)/Math.max(1,points.length-1);
  const x=i=>padL+i*stepX;
  const y=v=>padT+(1-(v-min)/Math.max(1,(max-min)))*(H-padT-padB);

  const gridLines=4;
  let grid='', yLabels='';
  for(let i=0;i<=gridLines;i++){
    const v=min+(max-min)*(i/gridLines);
    const yy=y(v);
    grid+=`<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="var(--border,#2a2a2e)" stroke-width="1" stroke-dasharray="3,3"/>`;
    yLabels+=`<text x="${padL-6}" y="${yy+3}" font-size="9" fill="var(--text-faint,#71717A)" text-anchor="end">${Math.round(v)}</text>`;
  }
  const showEvery=Math.max(1,Math.ceil(points.length/8));
  const xLabels=points.map((p,i)=> (i%showEvery===0||i===points.length-1) ? `<text x="${x(i)}" y="${H-6}" font-size="9" fill="var(--text-faint,#71717A)" text-anchor="middle">${fmtDate(p.date,{short:true})}</text>` : '').join('');

  const linePath=points.map((p,i)=>`${i===0?'M':'L'} ${x(i)} ${y(p.weight)}`).join(' ');
  const areaPath=`${linePath} L ${x(points.length-1)} ${H-padB} L ${x(0)} ${H-padB} Z`;
  const gradId='gradKeyEx_'+exId.replace(/[^a-zA-Z0-9]/g,'')+'_'+fmt.setsCount+'x'+fmt.repsCount;

  /* Chaque point est cliquable/tapable (r=6, cible large sur mobile) et révèle SON poids —
     pas seulement le dernier point comme avant. Le clic masque les autres labels affichés
     (querySelectorAll scopé au <svg> courant) et affiche celui du point touché. Le dernier
     point garde son label visible par défaut pour un aperçu immédiat. */
  const pointGroups=points.map((p,i)=>{
    const cx=x(i), cy=y(p.weight);
    const labelY=Math.max(11, cy-10);
    const anchor = i===0 ? 'start' : (i===points.length-1 ? 'end' : 'middle');
    const labelX = i===0 ? cx : (i===points.length-1 ? cx : cx);
    const isLast=i===points.length-1;
    return `<g>
      <circle cx="${cx}" cy="${cy}" r="6" fill="var(--accent,#18181B)" style="cursor:pointer;" onclick="var s=this.closest('svg'); s.querySelectorAll('.kx-label').forEach(function(t){t.style.opacity='0';}); this.nextElementSibling.style.opacity='1';">
        <title>${fmtDate(p.date,{short:true})}: ${p.weight}kg</title>
      </circle>
      <text class="kx-label" x="${labelX}" y="${labelY}" font-size="10" font-weight="700" fill="var(--accent,#18181B)" text-anchor="${anchor}" font-family="monospace" style="opacity:${isLast?1:0};pointer-events:none;">${p.weight}kg</text>
    </g>`;
  }).join('');

  return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="min-width:${W}px;">
    <defs><linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--accent,#18181B)" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="var(--accent,#18181B)" stop-opacity="0"/>
    </linearGradient></defs>
    ${grid}${yLabels}
    <path d="${areaPath}" fill="url(#${gradId})" stroke="none"/>
    <path d="${linePath}" fill="none" stroke="var(--accent,#18181B)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H-padB}" stroke="var(--border,#3a3a3e)" stroke-width="1"/>
    ${xLabels}
    ${pointGroups}
  </svg></div>`;
}

/* ---- Records ----
   NOTE : computeAllPRs()/trackingExId() restent INCHANGÉS et continuent d'alimenter le dashboard
   (renderRecentPRs) et le moteur de suggestion — on ne casse rien de ce qui en dépend déjà.
   La logique ci-dessous (computePRsByReps + renderPRs) est la nouvelle logique de la page Records,
   séparée et propre à cette page. */

/* Catégories d'affichage des records — directement dérivées de la catégorie réelle de l'exercice
   (exerciseCategory(), le même champ ex.category choisi à la création/édition de l'exercice).
   "Épaules & Santé / Préhab" est une vraie catégorie d'exercice (DB.categories) au même
   titre que Push/Pull/Legs/Abdos-Core : pour qu'un exercice y apparaisse, il suffit de la choisir
   dans le formulaire d'exercice, aucune heuristique de mots-clés n'est utilisée ici. */
const PR_CATEGORY_ORDER = ['PUSH','PULL','LEGS','ÉPAULES & SANTÉ / PRÉHAB','ABS / CORE'];
function prCategoryOf(ex){
  if(!ex) return 'PUSH';
  const cat=exerciseCategory(ex);
  if(cat==='Push') return 'PUSH';
  if(cat==='Pull') return 'PULL';
  if(cat==='Legs') return 'LEGS';
  if(cat==='Abdos / Core') return 'ABS / CORE';
  if(cat==='Épaules & Santé / Préhab') return 'ÉPAULES & SANTÉ / PRÉHAB';
  return 'PUSH'; // repli pour Endurance/Sports, rarement concerné par les records de charge
}
/* Records par [exId EXACT (exercice + variante précise)] x [nombre de reps] : la charge réelle
   maximale soulevée pour ce nombre de reps, TOUS nombres de séries confondus (1x5 à 100kg et
   5x5 à 100kg comptent bien pour le même record "Best 5 reps"). Filtré par profileId : les
   records de chaque personne restent strictement séparés (une séance sans profileId explicite
   retombe sur sessionProfileId(), jamais mélangée à l'aveugle). */
function computePRsByReps(profileId){
  const prs={};
  DB.sessions.filter(s=>s.status==='done' && (!profileId || sessionProfileId(s)===profileId)).forEach(s=>{
    (s.entries||[]).forEach(ex=>{
      (ex.sets||[]).forEach(st=>{
        if(!st.done) return;
        const w=Number(st.weight)||0, r=Number(st.reps)||0;
        if(w<=0||r<=0) return;
        if(!prs[ex.exId]) prs[ex.exId]={};
        const cur=prs[ex.exId][r];
        if(!cur || w>cur.weight || (w===cur.weight && s.date>cur.date)) prs[ex.exId][r]={weight:w,date:s.date};
      });
    });
  });
  return prs;
}
/* Rend les cartes de records groupées par catégorie PUSH/PULL/LEGS/ÉPAULES & SANTÉ/PRÉHAB/ABS-CORE,
   chaque exercice affichant tous ses "Best X reps" enregistrés, pour UN profil donné. */
function renderPRs(profileId){
  const prs=computePRsByReps(profileId);
  const exIds=Object.keys(prs).filter(id=>getExercise(id));
  if(!exIds.length) return `<div class="card empty-state"><div class="t">Aucun record</div><div class="d">Valide des séries en séance pour générer automatiquement tes records.</div></div>`;
  const byCat={};
  exIds.forEach(exId=>{ const cat=prCategoryOf(getExercise(exId)); (byCat[cat]=byCat[cat]||[]).push(exId); });
  return PR_CATEGORY_ORDER.filter(cat=>byCat[cat]&&byCat[cat].length).map(cat=>{
    const ids=byCat[cat].sort((a,b)=>exerciseDisplayName(getExercise(a)).localeCompare(exerciseDisplayName(getExercise(b)),'fr'));
    return `<div class="section-title" style="margin-top:16px;">${cat}</div>
    <div class="card">${ids.map(exId=>{
      const ex=getExercise(exId); const sport=getSport(ex.sportId);
      const reps=Object.entries(prs[exId]).map(([r,d])=>({reps:Number(r),weight:d.weight,date:d.date})).sort((a,b)=>a.reps-b.reps);
      return `<div class="list-item" style="align-items:flex-start;">
      <div class="swatch" style="background:${sport?.color||'#888'}"></div>
      <div class="main">
        <div class="title">${exerciseDisplayName(ex)}</div>
        <div class="meta" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;">${reps.map(r=>`<span class="chip" style="font-size:11px;">Best ${r.reps} reps : <b>${r.weight}kg</b> · ${fmtDate(r.date,{short:true})}</span>`).join('')}</div>
      </div></div>`;
    }).join('')}</div>`;
  }).join('');
}
function renderRecordsTab(){
  const selectedProfileId = CURRENT_PROFILE_ID;
  const goals=(DB.goals||[]).filter(g=>!g.achieved);
  const goalsHTML = goals.length ? `<div class="section-title" style="margin-top:0;">Objectifs en cours</div>
    <div class="card">${goals.map(g=>{
      const ex=getExercise(g.exId);
      return `<div style="margin-bottom:12px;"><div style="font-size:13px;font-weight:700;margin-bottom:4px;">${ex?ex.name:'?'}</div>${goalBarHTML(g)}</div>`;
    }).join('')}</div>` : '';
  return goalsHTML+renderPRs(selectedProfileId);
}

/* ---- Bilan de bloc ---- */
function renderBilanTab(){
  const blocks=[...DB.blocks].sort((a,b)=>b.startDate.localeCompare(a.startDate));
  if(!blocks.length) return `<div class="card empty-state"><div class="t">Aucun bloc</div><div class="d">Crée un bloc dans Programmes pour obtenir un bilan de fin de cycle.</div></div>`;
  const bid = BILAN_BLOCK_ID && getBlock(BILAN_BLOCK_ID) ? BILAN_BLOCK_ID : blocks[0].id;
  BILAN_BLOCK_ID=bid;
  const b=getBlock(bid);
  const sessions=DB.sessions.filter(s=>s.blockId===bid);
  const done=sessions.filter(s=>s.status==='done');
  const missed=sessions.filter(s=>s.status==='missed');
  const totalVol=done.reduce((sum,s)=>sum+sessionVolume(s),0);
  const avgRpe = (()=>{ let sum=0,n=0; done.forEach(s=>(s.entries||[]).forEach(ex=>ex.sets.forEach(st=>{if(st.done&&st.rpe){sum+=Number(st.rpe);n++;}}))); return n?(sum/n).toFixed(1):'—'; })();
  const half = done.length>=2 ? Math.floor(done.length/2) : 0;
  const firstHalf=done.slice(0,half), secondHalf=done.slice(half);
  const volFirst=firstHalf.reduce((s,x)=>s+sessionVolume(x),0), volSecond=secondHalf.reduce((s,x)=>s+sessionVolume(x),0);
  const evo = volFirst>0 ? Math.round(((volSecond-volFirst)/volFirst)*100) : null;
  return `
  <div class="field"><label>Bloc analysé</label><select id="bilan-select">${blocks.map(bl=>`<option value="${bl.id}" ${bl.id===bid?'selected':''}>${bl.name}</option>`).join('')}</select></div>
  <div class="card">
    <div class="card-header"><h2>${b.name}</h2><span class="chip">${fmtDate(b.startDate,{short:true})}–${fmtDate(b.endDate,{short:true})}</span></div>
    <div class="kpi-grid">
      <div class="kpi"><div class="lbl">Séances faites</div><div class="val mono">${done.length}</div></div>
      <div class="kpi"><div class="lbl">Séances manquées</div><div class="val mono" style="color:${missed.length?'var(--danger)':'var(--text)'}">${missed.length}</div></div>
      <div class="kpi"><div class="lbl">Volume total</div><div class="val mono">${Math.round(totalVol).toLocaleString('fr-FR')}kg</div></div>
      <div class="kpi"><div class="lbl">RPE moyen</div><div class="val mono">${avgRpe}</div></div>
    </div>
  </div>
  ${evo!==null?`<div class="card">
    <div class="card-header"><h2>Avant / après le cycle</h2></div>
    <div style="display:flex;align-items:center;gap:14px;">
      <div style="flex:1;text-align:center;"><div class="lbl" style="color:var(--text-dim);font-size:11px;">1re moitié</div><div class="mono" style="font-size:18px;font-weight:700;">${Math.round(volFirst)}kg</div></div>
      <div style="font-size:20px;color:${evo>=0?'var(--accent)':'var(--danger)'}">→</div>
      <div style="flex:1;text-align:center;"><div class="lbl" style="color:var(--text-dim);font-size:11px;">2e moitié</div><div class="mono" style="font-size:18px;font-weight:700;">${Math.round(volSecond)}kg</div></div>
    </div>
    <div style="text-align:center;margin-top:10px;" class="mono ${evo>=0?'delta up':'delta down'}">${evo>=0?'+':''}${evo}% de volume</div>
  </div>`:''}
  `;
}

/* ---- Corps ---- */
function renderBodyTab(){
  const goals=DB.settings;
  const todayLog = DB.nutrilog.find(n=>n.date===todayISO()) || {date:todayISO(),protein:0,carbs:0,fat:0,water:0};
  const bw=[...DB.bodylog].sort((a,b)=>a.date.localeCompare(b.date));
  const lastW = bw.length?bw[bw.length-1].weight:null;
  const trend = bw.length>=2 ? (bw[bw.length-1].weight - bw[Math.max(0,bw.length-8)].weight) : 0;
  return `
  <div class="card">
    <div class="card-header"><h2>Poids de corps</h2><span class="mono" style="font-size:15px;font-weight:700;">${lastW?lastW+' kg':'—'}</span></div>
    ${bw.length>=2? weightLineChart(bw) : `<div class="d" style="color:var(--text-dim);font-size:12.5px;padding:6px 0 12px;">Ajoute au moins 2 pesées pour voir la courbe de tendance.</div>`}
    ${bw.length>=2?`<div class="mono ${trend<=0?'delta up':'delta down'}" style="margin-bottom:10px;">${trend>0?'+':''}${trend.toFixed(1)}kg / 8 dernières pesées</div>`:''}
    <div class="row"><div class="field" style="margin-bottom:0;"><input type="number" step="0.1" id="bw-input" placeholder="Poids aujourd'hui (kg)"></div><button class="btn btn-primary" id="bw-add" style="width:auto;padding:0 18px;">OK</button></div>
  </div>
  <div class="card">
    <div class="card-header"><h2>Nutrition du jour</h2></div>
    ${['protein','carbs','fat','water'].map(k=>{
      const labels={protein:'Protéines (g)',carbs:'Glucides (g)',fat:'Lipides (g)',water:'Eau (L)'};
      const goal = goals['goal'+k.charAt(0).toUpperCase()+k.slice(1)] || 1;
      const val=Number(todayLog[k])||0;
      const pct=clamp((val/goal)*100,0,100);
      return `<div style="margin-bottom:12px;">
        <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text-dim);margin-bottom:5px;"><span>${labels[k]}</span><span class="mono">${val}/${goal}</span></div>
        <div class="progress-bar"><div style="width:${pct}%;background:${pct>=100?'var(--accent)':'var(--accent-2)'}"></div></div>
      </div>`;
    }).join('')}
    <button class="btn btn-secondary" id="edit-nutri" style="margin-top:6px;">Mettre à jour le journal</button>
  </div>
  `;
}
function weightLineChart(bw){
  const pts=bw.slice(-14);
  const W=Math.max(300,pts.length*30), H=110,padT=14,padB=10;
  const max=Math.max(...pts.map(p=>p.weight))+0.5, min=Math.min(...pts.map(p=>p.weight))-0.5;
  const stepX=(W-16)/Math.max(1,pts.length-1);
  const y=v=>padT+(1-(v-min)/Math.max(0.1,(max-min)))*(H-padT-padB);
  const path=pts.map((p,i)=>`${i===0?'M':'L'} ${8+i*stepX} ${y(p.weight)}`).join(' ');
  return `<div class="chart-wrap" style="margin-bottom:8px;"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="min-width:${W}px;">
    <path d="${path}" fill="none" stroke="var(--accent-2,#52525B)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg></div>`;
}

function bindStatsEvents(){
  $$('[data-stab]').forEach(b=>b.addEventListener('click',()=>{STATS_TAB=b.dataset.stab;render();}));
  const exSel=$('#stat-ex-select'); if(exSel) exSel.addEventListener('change',()=>{STATS_SELECTED_EX=exSel.value;STATS_SELECTED_FORMAT=null;render();}); // change d'exercice racine -> repart sur "Normal"
  const varSel=$('#stat-variant-select'); if(varSel) varSel.addEventListener('change',()=>{STATS_SELECTED_EX=varSel.value;STATS_SELECTED_FORMAT=null;render();});
  const fmtSel=$('#stat-format-select'); if(fmtSel) fmtSel.addEventListener('change',()=>{STATS_SELECTED_FORMAT=fmtSel.value;render();});
  const recProfSel=$('#records-profile-select'); if(recProfSel) recProfSel.addEventListener('change',()=>{STATS_RECORDS_PROFILE_ID=recProfSel.value;render();});
  const bilanSel=$('#bilan-select'); if(bilanSel) bilanSel.addEventListener('change',()=>{BILAN_BLOCK_ID=bilanSel.value;render();});

  const bwAdd=$('#bw-add');
  if(bwAdd) bwAdd.addEventListener('click',()=>{
    const v=Number($('#bw-input').value); if(!v){toast('Entre un poids valide');return;}
    const today=todayISO();
    const existing=DB.bodylog.find(b=>b.date===today);
    if(existing) existing.weight=v; else DB.bodylog.push({date:today,weight:v});
    saveDB(); toast('Poids enregistré'); render();
  });
  const editNutri=$('#edit-nutri');
  if(editNutri) editNutri.addEventListener('click',()=>{
    const log=DB.nutrilog.find(n=>n.date===todayISO())||{date:todayISO(),protein:0,carbs:0,fat:0,water:0};
    openModal('Journal du jour',`
      <div class="field"><label>Protéines (g)</label><input type="number" id="nu-protein" value="${log.protein}"></div>
      <div class="field"><label>Glucides (g)</label><input type="number" id="nu-carbs" value="${log.carbs}"></div>
      <div class="field"><label>Lipides (g)</label><input type="number" id="nu-fat" value="${log.fat}"></div>
      <div class="field"><label>Eau (L)</label><input type="number" step="0.1" id="nu-water" value="${log.water}"></div>
      <button class="btn btn-primary" id="nu-save">Enregistrer</button>
    `,{onMount:(m)=>{
      $('#nu-save',m).addEventListener('click',()=>{
        const data={date:todayISO(),protein:+$('#nu-protein',m).value||0,carbs:+$('#nu-carbs',m).value||0,fat:+$('#nu-fat',m).value||0,water:+$('#nu-water',m).value||0};
        const idx=DB.nutrilog.findIndex(n=>n.date===data.date);
        if(idx>=0) DB.nutrilog[idx]=data; else DB.nutrilog.push(data);
        saveDB(); closeModal(); render();
      });
    }});
  });
}

      restDefault:+$('#set-rest').value||90, units:$('#set-units').value
    });
    saveDB(); toast('Préférences enregistrées');
  });
  if(!DB.categories) DB.categories=[...DEFAULT_CATEGORIES];
  $('#add-category-btn').addEventListener('click',()=>{
    const input=$('#new-category-input'); const name=input.value.trim();
    if(!name){return;}
    if(DB.categories.some(c=>c.toLowerCase()===name.toLowerCase())){ toast('Cette catégorie existe déjà'); return; }
    DB.categories.push(name); saveDB(); input.value=''; render();
  });
  $('#new-category-input').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); $('#add-category-btn').click(); } });
  $$('.category-name-input').forEach(inp=>inp.addEventListener('change',()=>{
    const oldName=inp.dataset.category;
    const newName=inp.value.trim();
    if(!newName){ inp.value=oldName; return; }
    if(newName===oldName) return;
    if(DB.categories.some(c=>c.toLowerCase()===newName.toLowerCase())){ toast('Cette catégorie existe déjà'); inp.value=oldName; return; }
    /* Renommer met à jour la catégorie elle-même ET tous les exercices qui la référencent,
       pour qu'aucun exercice ne se retrouve orphelin d'une catégorie qui n'existe plus. */
    DB.categories=DB.categories.map(c=>c===oldName?newName:c);
    DB.exercises.forEach(e=>{ if(e.category===oldName) e.category=newName; });
    saveDB(); toast('Catégorie renommée'); render();
  }));
  $$('[data-del-category]').forEach(b=>b.addEventListener('click',()=>{
    const name=b.dataset.delCategory;
    const count=DB.exercises.filter(e=>!e.variantOf && exerciseCategory(e)===name).length;
    if(DB.categories.length<=1){ toast('Il doit rester au moins une catégorie'); return; }
    const msg=count>0
      ? `${count} exercice(s) utilisent "${name}". Les supprimer les laissera sans catégorie (ils retomberont sur la 1ère catégorie disponible). Continuer ?`
      : `Supprimer la catégorie "${name}" ?`;
    if(!confirm(msg))return;
    DB.categories=DB.categories.filter(c=>c!==name);
    const fallback=DB.categories[0];
    DB.exercises.forEach(e=>{ if(e.category===name) e.category=fallback; });
    saveDB(); toast('Catégorie supprimée'); render();
  }));
  if(!DB.muscles) DB.muscles=[...DEFAULT_MUSCLE_LIST];
  $('#add-muscle-btn').addEventListener('click',()=>{
    const input=$('#new-muscle-input'); const name=input.value.trim();
    if(!name){return;}
    if(DB.muscles.some(mu=>mu.toLowerCase()===name.toLowerCase())){ toast('Ce muscle existe déjà'); return; }
    DB.muscles.push(name); saveDB(); input.value=''; render();
  });
  $('#new-muscle-input').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); $('#add-muscle-btn').click(); } });
  $$('[data-del-muscle]').forEach(b=>b.addEventListener('click',()=>{
    if(!confirm(`Retirer "${b.dataset.delMuscle}" de la liste des muscles principaux ?`))return;
    DB.muscles=DB.muscles.filter(mu=>mu!==b.dataset.delMuscle); saveDB(); render();
  }));
  const addInj=$('#add-injury');
  if(addInj) addInj.addEventListener('click',()=>{
    openModal('Signaler une zone sensible',`
      <div class="field"><label>Zone</label><select id="inj-zone">${BODY_ZONES.map(z=>`<option>${z}</option>`).join('')}</select></div>
      <div class="field"><label>Sévérité</label><select id="inj-sev"><option>Légère</option><option>Modérée</option><option>Forte</option></select></div>
      <div class="field"><label>Note</label><input id="inj-note" placeholder="Ex: douleur en fin d'amplitude"></div>
      <button class="btn btn-primary" id="inj-save">Enregistrer</button>
    `,{onMount:(m)=>{
      $('#inj-save',m).addEventListener('click',()=>{
        DB.injuries.push({id:uid(),zone:$('#inj-zone',m).value,severity:$('#inj-sev',m).value,note:$('#inj-note',m).value.trim(),date:todayISO(),active:true});
        saveDB(); closeModal(); toast('Zone sensible ajoutée'); render();
      });
    }});
  });
  $$('[data-toggle-injury]').forEach(b=>b.addEventListener('click',()=>{
    const i=getInjury(b.dataset.toggleInjury); i.active=!i.active; saveDB(); render();
  }));
  $$('[data-del-injury]').forEach(b=>b.addEventListener('click',()=>{
    if(!confirm('Supprimer cette entrée ?'))return;
    DB.injuries=DB.injuries.filter(x=>x.id!==b.dataset.delInjury); saveDB(); render();
  }));
  $('#export-data').addEventListener('click',()=>{
    const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=`museoplan-export-${todayISO()}.json`; a.click();
    URL.revokeObjectURL(url);
    toast('Export lancé');
  });
  $('#import-data').addEventListener('click',()=>$('#import-file').click());
  $('#import-file').addEventListener('change',(e)=>{
    const file=e.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        const data=JSON.parse(reader.result);
        if(!confirm('Importer remplacera toutes les données du profil actif ('+profileName(CURRENT_PROFILE_ID)+'). Continuer ?'))return;
        const pd=Object.assign(defaultProfileData(),data);
        pd.settings=Object.assign(defaultProfileData().settings, data.settings||{});
        DB.blocks=pd.blocks; DB.routines=pd.routines; DB.sessions=pd.sessions; DB.bodylog=pd.bodylog;
        DB.nutrilog=pd.nutrilog; DB.injuries=pd.injuries; DB.goals=pd.goals; DB.settings=pd.settings;
        DB.settings.activeProfileId=CURRENT_PROFILE_ID;
        saveDB(); toast('Import réussi'); render();
      }catch(err){ toast('Fichier invalide'); }
    };
    reader.readAsText(file);
  });
  $('#reset-data').addEventListener('click',()=>{
    if(!confirm('Cette action supprimera définitivement toutes tes données. Continuer ?'))return;
    if(!confirm('Es-tu vraiment sûr ? Aucune sauvegarde ne sera conservée.'))return;
    const pd=defaultProfileData();
    DB.blocks=pd.blocks; DB.routines=pd.routines; DB.sessions=pd.sessions; DB.bodylog=pd.bodylog;
    DB.nutrilog=pd.nutrilog; DB.injuries=pd.injuries; DB.goals=pd.goals; DB.settings=pd.settings;
    DB.settings.activeProfileId=CURRENT_PROFILE_ID;
    saveDB(); toast('Données réinitialisées'); navigate('dashboard');
  });
  const installBtn=$('#pwa-install');
  if(DEFERRED_PROMPT){ installBtn.style.display='block'; installBtn.addEventListener('click',async()=>{ DEFERRED_PROMPT.prompt(); await DEFERRED_PROMPT.userChoice; DEFERRED_PROMPT=null; installBtn.style.display='none'; }); }
}

/* ============================================================
   DISPATCH events + init
   ============================================================ */
function bindViewEvents(){
  if(ROUTE==='dashboard'){
    renderCalendar();
    $$('[data-open-session]').forEach(el=>el.addEventListener('click',()=>openSessionDetail(el.dataset.openSession)));
    $('#cal-prev').addEventListener('click',()=>{ CAL_ANCHOR = CAL_MODE==='month'? addDays(CAL_ANCHOR,-30): addDays(CAL_ANCHOR,-7); renderCalendar(); });
    $('#cal-next').addEventListener('click',()=>{ CAL_ANCHOR = CAL_MODE==='month'? addDays(CAL_ANCHOR,30): addDays(CAL_ANCHOR,7); renderCalendar(); });
    $('#cal-today').addEventListener('click',()=>{ CAL_ANCHOR=todayISO(); renderCalendar(); });
    $$('.cal-toggle button').forEach(b=>b.addEventListener('click',()=>{ CAL_MODE=b.dataset.mode; renderCalendar(); $$('.cal-toggle button').forEach(x=>x.classList.toggle('active',x===b)); }));
  }
  else if(ROUTE==='session') bindSessionEvents();
  else if(ROUTE==='programs') bindProgramsEvents();
  else if(ROUTE==='stats') bindStatsEvents();
  else if(ROUTE==='settings') bindSettingsEvents();
}

/* ---------- PWA install prompt ---------- */
let DEFERRED_PROMPT=null;
window.addEventListener('beforeinstallprompt',(e)=>{ e.preventDefault(); DEFERRED_PROMPT=e; if(ROUTE==='settings') render(); });

/* ---------- Manifest dynamique (single-file PWA) ---------- */
(function injectManifest(){
  const manifest={
    name:"MuscoPlan", short_name:"MuscoPlan", start_url:".", display:"standalone",
    background_color:"#12151A", theme_color:"#12151A",
    icons:[{src:"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2312151A'/%3E%3Cpath d='M20 55 L36 55 L36 40 L50 40 L50 65 L64 65 L64 45 L80 45' stroke='%23FFFFFF' stroke-width='9' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E", sizes:"512x512", type:"image/svg+xml"}]
  };
  const blob=new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'});
  const link=document.createElement('link'); link.rel='manifest'; link.href=URL.createObjectURL(blob);
  document.head.appendChild(link);
})();

/* ---------- Notif icon = go today ---------- */
$('#btn-notif').addEventListener('click',()=>{ CAL_ANCHOR=todayISO(); if(ROUTE!=='dashboard') navigate('dashboard'); else renderCalendar(); });

/* ---------- Init ---------- */
migrateLegacyIfNeeded();
GLOBAL=loadGlobal();
showLockscreen();

</script>
